<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Checkout — The Good Papaya</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="gp-header">
  <a href="index.html" class="brand">← 🥭 The Good Papaya</a>
</header>

<main>
  <div id="err" class="err-box"></div>
  <div id="cart-list"></div>

  <div class="summary-row"><span>Items (<span id="item-count">0</span>)</span><span id="subtotal">₹0</span></div>
  <div class="summary-row total"><span>Total</span><span id="total">₹0</span></div>

  <div style="height:20px"></div>

  <div class="form-field">
    <label>Society / Community</label>
    <input type="text" id="society" placeholder="e.g. Prestige Ferns" autocomplete="off">
  </div>
  <div class="form-field">
    <label>Door / Flat number</label>
    <input type="text" id="door" placeholder="e.g. A1203" autocomplete="off">
  </div>
  <div class="form-field">
    <label>Phone number</label>
    <input type="tel" id="phone" placeholder="10-digit mobile number" maxlength="10" autocomplete="off">
  </div>
  <div class="form-field">
    <label>Notes (optional)</label>
    <textarea id="notes" rows="2" placeholder="Delivery instructions, ripeness preference, etc."></textarea>
  </div>

  <div class="form-field">
    <label>Payment</label>
    <div class="pay-toggle">
      <div class="pay-opt active" data-method="cod" onclick="setMethod('cod')">
        <div class="t">💵 Pay on Delivery</div>
        <div class="s">Cash or UPI at the door</div>
      </div>
      <div class="pay-opt" data-method="online" onclick="setMethod('online')">
        <div class="t">💳 Pay Now</div>
        <div class="s">Secure online payment</div>
      </div>
    </div>
  </div>

  <button class="btn-primary" id="place-btn" onclick="placeOrder()">Place Order</button>
  <div style="height:80px"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
let method = 'cod';
let catalogPrices = {};

function escH(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showErr(msg){const e=document.getElementById('err');e.textContent=msg;e.classList.add('show');}
function hideErr(){document.getElementById('err').classList.remove('show');}

// Highlights exactly the mandatory fields (society, door, phone) that
// are actually missing/invalid, rather than just a generic text error —
// clears as soon as the person starts correcting that one field, not all
// of them at once, since fixing one shouldn't hide a still-real problem
// with another.
function markInvalid(id,bad){
  const field=document.getElementById(id).closest('.form-field');
  if(field)field.classList.toggle('invalid',bad);
}
['society','door','phone'].forEach(id=>{
  document.getElementById(id).addEventListener('input',()=>markInvalid(id,false));
});

function setMethod(m) {
  method = m;
  document.querySelectorAll('.pay-opt').forEach(o => o.classList.toggle('active', o.dataset.method === m));
}

async function loadPrices() {
  const cart = getCart();
  if (!cart.length) return;
  const { data } = await sb.from('catalog').select('item_name,unit_price,unit,piece_approx_kg').in('item_name', cart.map(i => i.item_name));
  (data || []).forEach(r => catalogPrices[r.item_name] = r);
  renderCart();
}

function renderCart() {
  const cart = getCart();
  const list = document.getElementById('cart-list');
  if (!cart.length) {
    list.innerHTML = '<div class="empty-state">Your basket is empty. <a href="index.html" style="color:#2d6b2d;font-weight:700">Browse items →</a></div>';
    document.getElementById('place-btn').disabled = true;
    document.getElementById('item-count').textContent = '0';
    document.getElementById('subtotal').textContent = '₹0';
    document.getElementById('total').textContent = '₹0';
    return;
  }
  let subtotal = 0;
  let subtotalIsApprox = false;
  // An item can still be genuinely unestimable (sold by piece, but no
  // piece_approx_kg on file for it) — kept as its own caveat rather than
  // silently treating it as ₹0.
  let hasUnestimable = false;
  // Separate from hasUnestimable: the online-payment restriction below
  // is a COD-until-weighed policy call, not a pricing-data gap, so it
  // still keys off "any piece item" regardless of whether we can show
  // an estimate for it.
  const hasPieceItem = cart.some(i => i.mode === 'piece');
  list.innerHTML = cart.map(i => {
    const p = catalogPrices[i.item_name];
    if (i.mode === 'piece') {
      const hasApprox = p && p.piece_approx_kg;
      const approxWeight = hasApprox ? ' (~'+(i.quantity * p.piece_approx_kg).toFixed(2)+'kg)' : '';
      // unit_price is always per-kg — approx piece price = rate × est.
      // kg/piece × qty. Exact amount is only known once actually weighed
      // at packing, hence "~" and the note, not a firm number.
      const approxPrice = (hasApprox && p.unit_price != null) ? p.unit_price * p.piece_approx_kg * i.quantity : null;
      if (approxPrice != null) { subtotal += approxPrice; subtotalIsApprox = true; }
      else hasUnestimable = true;
      const priceLabel = approxPrice != null ? '~₹'+approxPrice.toFixed(0)+' (exact at packing)' : '🧾 priced at packing';
      return '<div class="cart-row">' +
        '<div class="info">' +
          '<div class="name">'+escH(i.item_name)+'</div>' +
          '<div class="price">'+i.quantity+' pc'+approxWeight+' · '+priceLabel+'</div>' +
          (i.note ? '<div class="price" style="color:#b5762a">📝 '+escH(i.note)+'</div>' : '') +
        '</div>' +
        '<a class="remove" onclick="removeItem('+escH(JSON.stringify(i.item_name))+')">Remove</a>' +
      '</div>';
    }
    const price = p ? p.unit_price : null;
    const lineTotal = price != null ? price * i.quantity : null;
    if (lineTotal != null) subtotal += lineTotal;
    return '<div class="cart-row">' +
      '<div class="info">' +
        '<div class="name">'+escH(i.item_name)+'</div>' +
        '<div class="price">'+i.quantity+' '+(p ? escH(p.unit||'kg') : '')+(lineTotal!=null?' · ₹'+lineTotal.toFixed(0):'')+'</div>' +
        (i.note ? '<div class="price" style="color:#b5762a">📝 '+escH(i.note)+'</div>' : '') +
      '</div>' +
      '<a class="remove" onclick="removeItem('+escH(JSON.stringify(i.item_name))+')">Remove</a>' +
    '</div>';
  }).join('');
  document.getElementById('item-count').textContent = cart.length;
  const totalText = (subtotalIsApprox?'~':'')+'₹'+subtotal.toFixed(0)+(hasUnestimable?' + packing items':'');
  document.getElementById('subtotal').textContent = totalText;
  document.getElementById('total').textContent = totalText;
  document.getElementById('place-btn').disabled = false;

  // Piece-mode items have no confirmed price yet, so there's nothing to
  // charge upfront — prepay is COD-only whenever any are in the basket.
  const onlineOpt = document.querySelector('.pay-opt[data-method="online"]');
  if (onlineOpt) {
    onlineOpt.classList.toggle('disabled', hasPieceItem);
    onlineOpt.onclick = hasPieceItem ? null : function(){ setMethod('online'); };
    onlineOpt.querySelector('.s').textContent = hasPieceItem
      ? 'Unavailable — basket has items priced at packing'
      : 'Secure online payment';
  }
  if (hasPieceItem && method === 'online') setMethod('cod');
}

function removeItem(item_name) {
  setCartQty(item_name, 0);
  renderCart();
}

async function placeOrder() {
  hideErr();
  const cart = getCart();
  const society = document.getElementById('society').value.trim();
  const door = document.getElementById('door').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const notes = document.getElementById('notes').value.trim();

  if (!cart.length) { showErr('Your basket is empty.'); return; }

  const phoneOk = /^\d{10}$/.test(phone);
  markInvalid('society', !society);
  markInvalid('door', !door);
  markInvalid('phone', !phoneOk);
  if (!society || !door || !phoneOk) {
    const missingLabels = [!society && 'Society/community', !door && 'Door/flat number', !phoneOk && 'Phone number'].filter(Boolean);
    showErr(missingLabels.length > 1
      ? 'Please fill in: ' + missingLabels.join(', ') + '.'
      : !society ? 'Please enter your society/community name.'
      : !door ? 'Please enter your door/flat number.'
      : 'Please enter a valid 10-digit phone number.');
    document.getElementById(!society ? 'society' : !door ? 'door' : 'phone').focus();
    return;
  }

  const btn = document.getElementById('place-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Placing order…';

  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/place-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        cart: cart.map(i => ({ item_name: i.item_name, quantity: i.quantity, mode: i.mode || 'kg', notes: i.note || undefined })),
        society, door_number: door, phone, notes,
        payment_method: method,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not place order');

    clearCart();
    if (data.payment_url) {
      window.location.href = data.payment_url;
    } else {
      window.location.href = 'order-confirmed.html?id=' + encodeURIComponent(data.sales_order_id);
    }
  } catch (e) {
    showErr(e.message);
    btn.disabled = false;
    btn.textContent = 'Place Order';
  }
}

renderCart();
loadPrices();
</script>
</body>
</html>
