<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Checkout — The Good Papaya</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="gp-header">
  <a href="index.html" class="brand">← 🥭 theGoodPapaya</a>
</header>

<main>
  <div id="err" class="err-box"></div>
  <a href="index.html" class="edit-cart-link">← Make changes to cart</a>
  <div id="cart-list"></div>

  <div class="cart-totals">
    <div class="summary-row"><span>Items (<span id="item-count">0</span>)</span><span id="subtotal">₹0</span></div>
    <div class="summary-row total"><span>Approx amount</span><span id="total">₹0</span></div>
    <div class="total-finePrint">Actual amount will vary slightly based on weight</div>
  </div>

  <div style="height:20px"></div>

  <div class="form-field">
    <label>Phone number</label>
    <input type="tel" id="phone" placeholder="10-digit mobile number" maxlength="10" autocomplete="off">
  </div>
  <div class="form-field" style="position:relative">
    <label>Society / Community</label>
    <input type="text" id="society" placeholder="Start typing your society name…" autocomplete="off"
      oninput="onSocietyInput()" onfocus="onSocietyInput()" onblur="hideSocietySuggestionsSoon()">
    <div id="society-suggestions" class="society-suggestions hidden"></div>
  </div>
  <div class="form-field">
    <label>Door / Flat number</label>
    <input type="text" id="door" placeholder="e.g. A1203" autocomplete="off">
  </div>
  <div class="form-field">
    <label>Delivery notes (optional)</label>
    <textarea id="notes" rows="2" placeholder="Delivery instructions, ripeness preference, etc."></textarea>
  </div>

  <!-- Pay Now parked for later (full history in git) — single COD-style
       flow for now, no payment choice to make at checkout. -->
  <button class="btn-primary" id="place-btn" onclick="placeOrder()">Confirm order</button>
  <div style="text-align:center;font-size:12px;color:#8a7a6a;margin-top:10px">You can view and pay invoices on the <a href="invoices.html" style="color:#2d6b2d;font-weight:700">My Invoices</a> page once your order is ready.</div>
  <div style="height:80px"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
// Pay Now is parked for now — always COD until it's back.
const method = 'cod';
let catalogPrices = {};

function escH(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showErr(msg){const e=document.getElementById('err');e.textContent=msg;e.classList.add('show');}
// Leafy items (subsection already set via catalog settings) are counted
// in bunches, not pieces — same underlying piece-mode plumbing either way.
function pieceUnitLabel(p){return p && p.subsection === 'Leafy Greens' ? 'bunch' : 'pc';}
function hideErr(){document.getElementById('err').classList.remove('show');}

// Highlights exactly the mandatory fields (society, door, phone) that
// are actually missing/invalid, rather than just a generic text error —
// clears as soon as the person starts correcting that one field, not all
// of them at once, since fixing one shouldn't hide a still-real problem
// with another.
function markInvalid(id,bad){
  const field=document.getElementById(id).closest('.form-field');
  if(field)field.classList.toggle('invalid',bad);
}
['society','door','phone'].forEach(id=>{
  document.getElementById(id).addEventListener('input',()=>markInvalid(id,false));
});

// ── Society search (string-contains, verified names only) ────────────────
// communities.name gets junk auto-added from every typo'd order address —
// verified=true (set by hand in ops-dashboard Config) is the only filter,
// so customers never see garbage in the dropdown. Loaded once, lazily, not
// on page load — most visits to checkout never touch this field at all.
let verifiedSocieties = null;
let societySuggestTimer = null;

async function loadVerifiedSocieties() {
  if (verifiedSocieties) return verifiedSocieties;
  const { data } = await sb.from('communities').select('name').eq('verified', true).order('name');
  verifiedSocieties = (data || []).map(r => r.name);
  return verifiedSocieties;
}

function onSocietyInput() {
  clearTimeout(societySuggestTimer);
  societySuggestTimer = setTimeout(renderSocietySuggestions, 120);
}

async function renderSocietySuggestions() {
  const box = document.getElementById('society-suggestions');
  const q = document.getElementById('society').value.trim().toLowerCase();
  if (!q) { box.classList.add('hidden'); box.innerHTML = ''; return; }
  const list = await loadVerifiedSocieties();
  const matches = list.filter(n => n.toLowerCase().includes(q)).slice(0, 8);
  if (!matches.length) { box.classList.add('hidden'); box.innerHTML = ''; return; }
  box.innerHTML = matches.map(n =>
    '<div class="society-suggestion" onclick="selectSociety('+escH(JSON.stringify(n))+')">'+escH(n)+'</div>'
  ).join('');
  box.classList.remove('hidden');
}

function selectSociety(name) {
  document.getElementById('society').value = name;
  markInvalid('society', false);
  hideSocietySuggestions();
}

function hideSocietySuggestions() {
  const box = document.getElementById('society-suggestions');
  box.classList.add('hidden');
  box.innerHTML = '';
}

// blur fires before a suggestion's click finishes registering — a short
// delay lets the click go through first, instead of the dropdown
// vanishing out from under the tap.
function hideSocietySuggestionsSoon() {
  setTimeout(hideSocietySuggestions, 150);
}

// ── Remember last order (this device only) ────────────────────────────────
// Deliberately NOT a server lookup keyed by phone number — anyone who
// knows (or guesses) a phone number could otherwise pull up a stranger's
// address. This only ever recalls what THIS browser itself last
// submitted, so it can never expose someone else's details.
const LAST_ORDER_KEY = 'gp_last_order_v1';

function prefillFromLastOrder() {
  try {
    const last = JSON.parse(localStorage.getItem(LAST_ORDER_KEY) || 'null');
    if (!last) return;
    if (last.phone) document.getElementById('phone').value = last.phone;
    if (last.society) document.getElementById('society').value = last.society;
    if (last.door) document.getElementById('door').value = last.door;
  } catch {}
}

function saveLastOrder(society, door, phone) {
  try { localStorage.setItem(LAST_ORDER_KEY, JSON.stringify({ society, door, phone })); } catch {}
}

async function loadPrices() {
  const cart = getCart();
  if (!cart.length) return;
  const { data } = await sb.from('catalog').select('item_name,unit_price,unit,piece_approx_kg,subsection').in('item_name', cart.map(i => i.item_name));
  (data || []).forEach(r => catalogPrices[r.item_name] = r);
  renderCart();
}

function renderCart() {
  const cart = getCart();
  const list = document.getElementById('cart-list');
  if (!cart.length) {
    list.innerHTML = '<div class="empty-state">Your basket is empty. <a href="index.html" style="color:#2d6b2d;font-weight:700">Browse items →</a></div>';
    document.getElementById('place-btn').disabled = true;
    document.getElementById('item-count').textContent = '0';
    document.getElementById('subtotal').textContent = '₹0';
    document.getElementById('total').textContent = '₹0';
    return;
  }
  let subtotal = 0;
  let subtotalIsApprox = false;
  // An item can still be genuinely unestimable (sold by piece, but no
  // piece_approx_kg on file for it) — kept as its own caveat rather than
  // silently treating it as ₹0.
  let hasUnestimable = false;
  list.innerHTML = cart.map(i => {
    const p = catalogPrices[i.item_name];
    if (i.mode === 'piece') {
      const hasApprox = p && p.piece_approx_kg;
      const approxWeight = hasApprox ? ' (~'+(i.quantity * p.piece_approx_kg).toFixed(2)+'kg)' : '';
      // unit_price is always per-kg — approx piece price = rate × est.
      // kg/piece × qty. Exact amount is only known once actually weighed
      // at packing, hence "~" and the note, not a firm number.
      const approxPrice = (hasApprox && p.unit_price != null) ? p.unit_price * p.piece_approx_kg * i.quantity : null;
      if (approxPrice != null) { subtotal += approxPrice; subtotalIsApprox = true; }
      else hasUnestimable = true;
      const priceLabel = approxPrice != null ? '~₹'+approxPrice.toFixed(0)+' (exact at packing)' : '🧾 priced at packing';
      return '<div class="cart-row">' +
        '<div class="info">' +
          '<div class="name">'+escH(i.item_name)+'</div>' +
          '<div class="price">'+i.quantity+' '+pieceUnitLabel(p)+approxWeight+' · '+priceLabel+'</div>' +
          (i.note ? '<div class="price" style="color:#b5762a">📝 '+escH(i.note)+'</div>' : '') +
        '</div>' +
      '</div>';
    }
    const price = p ? p.unit_price : null;
    const lineTotal = price != null ? price * i.quantity : null;
    if (lineTotal != null) subtotal += lineTotal;
    return '<div class="cart-row">' +
      '<div class="info">' +
        '<div class="name">'+escH(i.item_name)+'</div>' +
        '<div class="price">'+i.quantity+' '+(p ? escH(p.unit||'kg') : '')+(lineTotal!=null?' · ₹'+lineTotal.toFixed(0):'')+'</div>' +
        (i.note ? '<div class="price" style="color:#b5762a">📝 '+escH(i.note)+'</div>' : '') +
      '</div>' +
    '</div>';
  }).join('');
  document.getElementById('item-count').textContent = cart.length;
  const totalText = (subtotalIsApprox?'~':'')+'₹'+subtotal.toFixed(0)+(hasUnestimable?' + packing items':'');
  document.getElementById('subtotal').textContent = totalText;
  document.getElementById('total').textContent = totalText;
  document.getElementById('place-btn').disabled = false;
}

async function placeOrder() {
  hideErr();
  const cart = getCart();
  const society = document.getElementById('society').value.trim();
  const door = document.getElementById('door').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const notes = document.getElementById('notes').value.trim();

  if (!cart.length) { showErr('Your basket is empty.'); return; }

  const phoneOk = /^\d{10}$/.test(phone);
  markInvalid('society', !society);
  markInvalid('door', !door);
  markInvalid('phone', !phoneOk);
  if (!society || !door || !phoneOk) {
    const missingLabels = [!society && 'Society/community', !door && 'Door/flat number', !phoneOk && 'Phone number'].filter(Boolean);
    showErr(missingLabels.length > 1
      ? 'Please fill in: ' + missingLabels.join(', ') + '.'
      : !society ? 'Please enter your society/community name.'
      : !door ? 'Please enter your door/flat number.'
      : 'Please enter a valid 10-digit phone number.');
    document.getElementById(!society ? 'society' : !door ? 'door' : 'phone').focus();
    return;
  }

  const btn = document.getElementById('place-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Placing order…';

  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/place-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        cart: cart.map(i => ({ item_name: i.item_name, quantity: i.quantity, mode: i.mode || 'kg', notes: i.note || undefined })),
        society, door_number: door, phone, notes,
        payment_method: method,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not place order');

    saveLastOrder(society, door, phone);
    setKnownPhone(phone);
    markTodaysOrderPlaced(data.sales_order_id);
    clearCart();
    if (data.payment_url) {
      window.location.href = data.payment_url;
    } else {
      window.location.href = 'order-confirmed.html?id=' + encodeURIComponent(data.sales_order_id);
    }
  } catch (e) {
    showErr(e.message);
    btn.disabled = false;
    btn.textContent = 'Place Order';
  }
}

prefillFromLastOrder();
renderCart();
loadPrices();

// Mobile browsers (notably in-app browsers like WhatsApp's) often restore
// a page from back/forward cache instead of reloading it when you
// navigate back to it — if this page was still mid-fetch the moment you
// left, that frozen state comes back exactly as it was, and none of this
// script re-runs to retry it. event.persisted means exactly that kind of
// restore, not a fresh load.
window.addEventListener('pageshow', e => { if (e.persisted) { renderCart(); loadPrices(); } });
</script>
</body>
</html>
