<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fykqprogzqcfzrgwlrem.supabase.co" crossorigin>
<title>Checkout — The Good Papaya</title>
<meta property="og:title" content="theGoodPapaya">
<meta property="og:description" content="Fresh fruits &amp; vegetables, delivered straight from mandi to your doorstep, every single day.">
<meta property="og:image" content="https://thegoodpapaya.com/og-image.png">
<meta property="og:url" content="https://thegoodpapaya.com/checkout.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="gp-header">
  <a href="index.html" class="brand">← 🥭 theGoodPapaya</a>
</header>

<main>
  <div id="err" class="err-box"></div>
  <a href="index.html" class="edit-cart-link">← Make changes to cart</a>
  <div id="cart-list"></div>

  <div class="cart-totals">
    <div class="summary-row"><span>Items (<span id="item-count">0</span>)</span><span id="subtotal">₹0</span></div>
    <div class="total-finePrint" id="total-fine-print"></div>
  </div>

  <div style="height:20px"></div>

  <div class="form-field">
    <label>Phone number</label>
    <input type="tel" id="phone" placeholder="10-digit mobile number" maxlength="10" autocomplete="off">
  </div>
  <div class="form-field" style="position:relative">
    <label>Society / Community</label>
    <input type="text" id="society" placeholder="Start typing your society name…" autocomplete="off"
      oninput="onSocietyInput()" onfocus="onSocietyInput()" onblur="hideSocietySuggestionsSoon()">
    <div id="society-suggestions" class="society-suggestions hidden"></div>
  </div>
  <div class="form-field">
    <label>Door / Flat number</label>
    <input type="text" id="door" placeholder="e.g. A1203" autocomplete="off">
  </div>
  <div class="form-field">
    <label>Delivery date</label>
    <input type="date" id="delivery-date">
  </div>
  <div class="form-field">
    <label>Deliver before (optional)</label>
    <input type="time" id="preferred-time">
    <div class="total-finePrint" style="margin-top:5px">We'll try our best to deliver as close as possible to your preferred time.</div>
  </div>
  <div class="form-field">
    <label>Delivery notes (optional)</label>
    <textarea id="notes" rows="2" placeholder="Delivery instructions, ripeness preference, etc."></textarea>
  </div>

  <!-- Pay Now parked for later (full history in git) — single COD-style
       flow for now, no payment choice to make at checkout. -->
  <button class="btn-primary" id="place-btn" onclick="placeOrder()">Confirm order</button>
  <div style="text-align:center;font-size:12px;color:#8a7a6a;margin-top:10px">You can view and pay invoices on the <a href="invoices.html" style="color:#2d6b2d;font-weight:700">My Invoices</a> page once your order is ready.</div>
  <div style="height:80px"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
// Pay Now is parked for now — always COD until it's back.
const method = 'cod';
let catalogPrices = {};

function escH(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showErr(msg){const e=document.getElementById('err');e.textContent=msg;e.classList.add('show');}
// Leafy items (subsection already set via catalog settings) are counted
// in bunches, not pieces — same underlying piece-mode plumbing either way.
function pieceUnitLabel(p){return p && p.subsection === 'Leafy Greens' ? 'bunch' : 'pc';}
function hideErr(){document.getElementById('err').classList.remove('show');}

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}

// Same field the ops dashboard's own "entry date" picker fills — the
// date prefix of sales_order_id itself (see place-order), so a customer
// can ask for delivery on a future day, not just today. Same forward
// range staff get there (today..+15 days); no past dates though, unlike
// staff's own picker, which also allows backdating for corrections.
function initDeliveryDate() {
  const el = document.getElementById('delivery-date');
  const today = todayIST();
  el.min = today;
  el.max = addDays(today, 15);
  if (!el.value) el.value = today;
}

// Defaults "Deliver before" to 5 hours from right now (IST), rather than
// leaving it blank — most customers ordering for same-day delivery want
// roughly that much lead time, and it's just a starting point they can
// still change. Never overwrites a value already there (a draft restore,
// or the customer's own edit surviving a bfcache restore — see the
// pageshow listener below).
function defaultPreferredTime() {
  const d = new Date(Date.now() + (330 + 5 * 60) * 60 * 1000); // IST (+330m), then +5h
  return String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0');
}
function initPreferredTime() {
  const el = document.getElementById('preferred-time');
  if (!el.value) el.value = defaultPreferredTime();
}

// Highlights exactly the mandatory fields (society, door, phone) that
// are actually missing/invalid, rather than just a generic text error —
// clears as soon as the person starts correcting that one field, not all
// of them at once, since fixing one shouldn't hide a still-real problem
// with another.
function markInvalid(id,bad){
  const field=document.getElementById(id).closest('.form-field');
  if(field)field.classList.toggle('invalid',bad);
}
['society','door','phone'].forEach(id=>{
  document.getElementById(id).addEventListener('input',()=>markInvalid(id,false));
});

// ── Funnel tracking (storefront_events) ───────────────────────────────────
// Logged on blur, not on every keystroke — "did they get this far" is
// what matters for a funnel, not how many times they edited the field.
// Some duplicate rows across an edit session are fine; reports group by
// device_id/event_type anyway (see migration 165's own comment).
document.getElementById('phone').addEventListener('blur', () => {
  const v = document.getElementById('phone').value.trim();
  if (/^\d{10}$/.test(v)) trackEvent('phone_entered', { phone: v });
});
document.getElementById('door').addEventListener('blur', () => {
  const society = document.getElementById('society').value.trim();
  const door = document.getElementById('door').value.trim();
  const phone = document.getElementById('phone').value.trim();
  if (society && door && /^\d{10}$/.test(phone)) {
    trackEvent('society_entered', { society, door_number: door, phone });
  }
});

// ── Society search (string-contains, verified names only) ────────────────
// communities.name gets junk auto-added from every typo'd order address —
// verified=true (set by hand in ops-dashboard Config) is the only filter,
// so customers never see garbage in the dropdown. Loaded once, lazily, not
// on page load — most visits to checkout never touch this field at all.
let verifiedSocieties = null;
let societySuggestTimer = null;

async function loadVerifiedSocieties() {
  if (verifiedSocieties) return verifiedSocieties;
  const { data } = await sb.from('communities').select('name').eq('verified', true).order('name');
  verifiedSocieties = (data || []).map(r => r.name);
  return verifiedSocieties;
}

function onSocietyInput() {
  clearTimeout(societySuggestTimer);
  societySuggestTimer = setTimeout(renderSocietySuggestions, 120);
}

async function renderSocietySuggestions() {
  const box = document.getElementById('society-suggestions');
  const q = document.getElementById('society').value.trim().toLowerCase();
  if (!q) { box.classList.add('hidden'); box.innerHTML = ''; return; }
  const list = await loadVerifiedSocieties();
  const matches = list.filter(n => n.toLowerCase().includes(q)).slice(0, 20);
  if (!matches.length) { box.classList.add('hidden'); box.innerHTML = ''; return; }
  box.innerHTML = matches.map(n =>
    '<div class="society-suggestion" onclick="selectSociety('+escH(JSON.stringify(n))+')">'+escH(n)+'</div>'
  ).join('');
  box.classList.remove('hidden');
}

function selectSociety(name) {
  document.getElementById('society').value = name;
  markInvalid('society', false);
  hideSocietySuggestions();
}

function hideSocietySuggestions() {
  const box = document.getElementById('society-suggestions');
  box.classList.add('hidden');
  box.innerHTML = '';
}

// blur fires before a suggestion's click finishes registering — a short
// delay lets the click go through first, instead of the dropdown
// vanishing out from under the tap.
function hideSocietySuggestionsSoon() {
  setTimeout(hideSocietySuggestions, 150);
}

// ── Remember last order (this device only) ────────────────────────────────
// Deliberately NOT a server lookup keyed by phone number — anyone who
// knows (or guesses) a phone number could otherwise pull up a stranger's
// address. This only ever recalls what THIS browser itself last
// submitted, so it can never expose someone else's details.
//
// Also doubles as a live in-progress draft, not just "last completed
// order" — saved on blur of every field below, not only after Confirm
// Order succeeds. Without this, tapping "← Make changes to cart" to add
// one more thing and coming back wiped out everything already typed in
// (nothing had been saved yet, since the only save point used to be a
// successful order). Preferred delivery time is deliberately NOT part of
// this draft — it's a per-order choice, not a fixed address, so each new
// checkout should start blank rather than reusing last time's time.
const LAST_ORDER_KEY = 'gp_last_order_v1';

function prefillFromLastOrder() {
  try {
    const last = JSON.parse(localStorage.getItem(LAST_ORDER_KEY) || 'null');
    // The draft's own phone wins when it has one, but a draft can exist
    // with no phone in it yet (e.g. society was typed and blurred before
    // phone was) — falling back to getKnownPhone() in that case too,
    // not just when there's no draft at all, is what actually carries a
    // phone typed earlier on My Orders/My Invoices through to checkout.
    const phone = (last && last.phone) || getKnownPhone();
    if (phone) document.getElementById('phone').value = phone;
    if (last) {
      if (last.society) document.getElementById('society').value = last.society;
      if (last.door) document.getElementById('door').value = last.door;
      if (last.notes) document.getElementById('notes').value = last.notes;
      // Only reuse a saved delivery date if it's still a valid choice —
      // a draft from a few days ago shouldn't silently pick a date in
      // the past once initDeliveryDate() sets today's min/max below.
      if (last.deliveryDate && last.deliveryDate >= todayIST()) document.getElementById('delivery-date').value = last.deliveryDate;
    }
  } catch {}
}

function saveLastOrder(society, door, phone, notes, deliveryDate) {
  try { localStorage.setItem(LAST_ORDER_KEY, JSON.stringify({ society, door, phone, notes, deliveryDate })); } catch {}
}

// Fired on blur of every field that should survive a trip back to the
// cart and back — see the comment on LAST_ORDER_KEY above.
function saveDraft() {
  saveLastOrder(
    document.getElementById('society').value.trim(),
    document.getElementById('door').value.trim(),
    document.getElementById('phone').value.trim(),
    document.getElementById('notes').value.trim(),
    document.getElementById('delivery-date').value,
  );
}
['society', 'door', 'phone', 'notes'].forEach(id => {
  document.getElementById(id).addEventListener('blur', saveDraft);
});
document.getElementById('delivery-date').addEventListener('change', saveDraft);

async function loadPrices() {
  const cart = getCart();
  if (!cart.length) return;
  const { data } = await sb.from('catalog').select('item_name,unit_price,unit,piece_approx_kg,box_approx_kg,subsection').in('item_name', cart.map(i => i.item_name));
  (data || []).forEach(r => catalogPrices[r.item_name] = r);
  renderCart();
}

function renderCart() {
  const cart = getCart();
  const list = document.getElementById('cart-list');
  if (!cart.length) {
    list.innerHTML = '<div class="empty-state">Your basket is empty. <a href="index.html" style="color:#2d6b2d;font-weight:700">Browse items →</a></div>';
    document.getElementById('place-btn').disabled = true;
    document.getElementById('item-count').textContent = '0';
    document.getElementById('subtotal').textContent = '₹0';
    document.getElementById('total-fine-print').textContent = '';
    return;
  }
  let subtotal = 0;
  // An item can still be genuinely unestimable (no unit_price on file at
  // all) — kept as its own caveat rather than silently treating it as ₹0.
  let hasUnestimable = false;
  // The real test isn't the item's category — it's whether the customer's
  // selected mode matches the unit Zoho actually prices this item in
  // (catalog.unit). kg and box always match by construction (kg mode only
  // exists for kg-priced items; box is only ever offered when Zoho's unit
  // really is box). Piece mode is the one that can go either way: Zoho
  // priced per piece (unit='pc', e.g. White Dragon) applies flat; Zoho
  // priced per kg (unit='kg', e.g. Apple, or a leafy bunch) needs
  // converting through piece_approx_kg instead of applying the rate directly.
  let subtotalIsApprox = false;
  const rows = cart.map(i => {
    const p = catalogPrices[i.item_name];
    const unit = p ? (p.unit || 'kg') : 'kg';
    const needsConversion = i.mode === 'piece' && unit.toLowerCase() === 'kg';

    let qtyLabel;
    if (i.mode === 'piece') qtyLabel = i.quantity + ' ' + pieceUnitLabel(p);
    else if (i.mode === 'box') qtyLabel = i.quantity + ' box';
    else qtyLabel = i.quantity + ' ' + escH(unit);

    const rateLabel = p?.unit_price != null ? '₹'+p.unit_price.toFixed(0)+'/'+escH(unit) : '—';
    const amount = needsConversion
      ? ((p?.piece_approx_kg && p?.unit_price != null) ? p.unit_price * p.piece_approx_kg * i.quantity : null)
      : (p?.unit_price != null ? p.unit_price * i.quantity : null);

    if (amount != null) { subtotal += amount; if (needsConversion) subtotalIsApprox = true; }
    else hasUnestimable = true;
    const amountLabel = amount != null ? (needsConversion?'~':'')+'₹'+amount.toFixed(0) : '🧾 at packing';

    return '<tr>' +
      '<td>'+escH(i.item_name)+(i.note ? '<div class="price" style="color:#b5762a">📝 '+escH(i.note)+'</div>' : '')+'</td>' +
      '<td>'+rateLabel+'</td>' +
      '<td>'+qtyLabel+'</td>' +
      '<td>'+amountLabel+'</td>' +
    '</tr>';
  }).join('');
  list.innerHTML = '<table class="inv-items"><thead><tr><th>Item</th><th>Rate</th><th>Qty</th><th>Amount</th></tr></thead><tbody>'+rows+'</tbody></table>';
  document.getElementById('item-count').textContent = cart.length;
  const totalText = (subtotalIsApprox?'~':'')+'₹'+subtotal.toFixed(0)+(hasUnestimable?' + packing items':'');
  document.getElementById('subtotal').textContent = totalText;
  document.getElementById('total-fine-print').textContent = '(approx total, actual to be calculated post packaging)';
  document.getElementById('place-btn').disabled = false;
}

async function placeOrder() {
  hideErr();
  const cart = getCart();
  const society = document.getElementById('society').value.trim();
  const door = document.getElementById('door').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const notes = document.getElementById('notes').value.trim();

  if (!cart.length) { showErr('Your basket is empty.'); return; }

  const phoneOk = /^\d{10}$/.test(phone);
  markInvalid('society', !society);
  markInvalid('door', !door);
  markInvalid('phone', !phoneOk);
  if (!society || !door || !phoneOk) {
    const missingLabels = [!society && 'Society/community', !door && 'Door/flat number', !phoneOk && 'Phone number'].filter(Boolean);
    showErr(missingLabels.length > 1
      ? 'Please fill in: ' + missingLabels.join(', ') + '.'
      : !society ? 'Please enter your society/community name.'
      : !door ? 'Please enter your door/flat number.'
      : 'Please enter a valid 10-digit phone number.');
    document.getElementById(!society ? 'society' : !door ? 'door' : 'phone').focus();
    return;
  }

  const btn = document.getElementById('place-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Placing order…';

  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/place-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        cart: cart.map(i => ({ item_name: i.item_name, quantity: i.quantity, mode: i.mode || 'kg', notes: i.note || undefined })),
        society, door_number: door, phone, notes,
        delivery_date: document.getElementById('delivery-date').value,
        preferred_time: document.getElementById('preferred-time').value || undefined,
        payment_method: method,
        device_id: getDeviceId(),
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not place order');

    saveLastOrder(society, door, phone, notes, document.getElementById('delivery-date').value);
    setKnownPhone(phone);
    markTodaysOrderPlaced(data.sales_order_id);
    clearCart();
    if (data.payment_url) {
      window.location.href = data.payment_url;
    } else {
      window.location.href = 'order-confirmed.html?id=' + encodeURIComponent(data.sales_order_id);
    }
  } catch (e) {
    showErr(e.message);
    btn.disabled = false;
    btn.textContent = 'Place Order';
  }
}

prefillFromLastOrder();
initDeliveryDate();
initPreferredTime();
renderCart();
loadPrices();
// Fired once here, not inside renderCart() — that also re-runs on a
// bfcache restore (see the pageshow listener below), which isn't a new
// page visit and shouldn't be double-counted as one.
if (getCart().length) trackEvent('checkout_viewed', {});

// Mobile browsers (notably in-app browsers like WhatsApp's) often restore
// a page from back/forward cache instead of reloading it when you
// navigate back to it — if this page was still mid-fetch the moment you
// left, that frozen state comes back exactly as it was, and none of this
// script re-runs to retry it. event.persisted means exactly that kind of
// restore, not a fresh load.
window.addEventListener('pageshow', e => { if (e.persisted) { initDeliveryDate(); initPreferredTime(); renderCart(); loadPrices(); } });
</script>
</body>
</html>
