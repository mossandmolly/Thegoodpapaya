<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>My Invoices — The Good Papaya</title>
<link rel="stylesheet" href="style.css">
<style>
/* Page-specific layout — only invoices.html goes wider than the shared
   640px main column, to make room for the feedback card beside it. Keeps
   style.css's main{} rule untouched for every other storefront page. */
.page-wrap{display:flex;flex-direction:column;gap:20px;max-width:1000px;margin:0 auto;padding:0 16px}
.page-wrap>main{max-width:none;margin:0;padding:16px 0;flex:1 1 auto;min-width:0}
.feedback-aside{flex:0 0 auto}
@media(min-width:860px){
  .page-wrap{flex-direction:row;align-items:flex-start;padding:0 16px}
  .page-wrap>main{padding:16px 16px 16px 0;max-width:640px}
  .feedback-aside{flex:0 0 300px;position:sticky;top:76px}
}
.feedback-card{border:1px solid #eee0d0;border-radius:14px;padding:16px;background:#fffaf2;margin-top:16px}
@media(min-width:860px){.feedback-card{margin-top:16px}}
.feedback-intro{font-size:13px;color:#5c5346;line-height:1.5;margin-bottom:10px}
.feedback-offer{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:15px;font-weight:700;color:#1e5c1e;background:#eaf6ea;border:1px dashed #2d6b2d;border-radius:10px;padding:10px 12px;margin-bottom:14px;line-height:1.4}
.feedback-offer-note{display:block;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-style:normal;font-weight:400;font-size:11px;color:#a89b8a;margin-top:3px}
.feedback-card .form-field{margin-bottom:14px}
.fb-smileys{display:flex;justify-content:space-between;gap:4px;margin-top:4px}
.fb-smiley{flex:1;font-size:21px;background:#fff;border:1px solid #eee0d0;border-radius:10px;padding:6px 0;cursor:pointer;line-height:1}
.fb-smiley.active{border-color:#2d6b2d;background:#eaf3ea}
.fb-smiley-labels{display:flex;justify-content:space-between;font-size:10px;color:#a89b8a;margin-top:4px}
.feedback-card .btn-primary{padding:11px;font-size:14px}
#fb-result{margin-top:8px;font-size:12px}
#fb-result.ok{color:#2d6b2d;font-weight:700}
#fb-result.err{color:#b3261e}
</style>
</head>
<body>

<header class="gp-header">
  <a href="index.html" class="brand">🥭 The Good Papaya</a>
</header>

<div class="page-wrap">
<main>
  <div id="phone-screen">
    <h2 style="margin-top:0">View your invoices</h2>
    <div class="form-field">
      <label>Your phone number</label>
      <input type="tel" id="phone" placeholder="10-digit mobile number" maxlength="10" autocomplete="off">
    </div>
    <button class="btn-primary" id="lookup-btn" onclick="lookup()">View My Invoices</button>
  </div>

  <div id="results-screen" class="hidden">
    <h2 id="welcome-heading"></h2>
    <div id="results"></div>
    <div style="height:16px"></div>
    <a href="#" id="change-number-link" onclick="showPhoneScreen();return false;" style="font-size:13px;color:#8a7a6a">Not you? Use a different number</a>
  </div>
</main>
<aside class="feedback-aside" id="feedback-aside">
  <div class="feedback-card hidden" id="feedback-card">
    <div class="feedback-offer">Help us improve, get ₹50 off on your next order!<span class="feedback-offer-note">(valid once within a 30 day period)</span></div>
    <div class="form-field">
      <label>What can we improve?</label>
      <textarea id="fb-improve" rows="3" placeholder="Tell us anything..."></textarea>
    </div>
    <div class="form-field">
      <label>Would you recommend us to a friend?</label>
      <div class="fb-smileys" id="fb-smileys">
        <button type="button" class="fb-smiley" data-score="1" onclick="setFbScore(1)" title="Not right now">😠</button>
        <button type="button" class="fb-smiley" data-score="2" onclick="setFbScore(2)" title="2">🙁</button>
        <button type="button" class="fb-smiley" data-score="3" onclick="setFbScore(3)" title="3">😐</button>
        <button type="button" class="fb-smiley" data-score="4" onclick="setFbScore(4)" title="4">🙂</button>
        <button type="button" class="fb-smiley" data-score="5" onclick="setFbScore(5)" title="Absolutely!">😍</button>
      </div>
      <div class="fb-smiley-labels"><span>Not right now</span><span>Absolutely!</span></div>
    </div>
    <button class="btn-primary" id="fb-submit-btn" onclick="submitFeedback()">Submit feedback</button>
    <div id="fb-result"></div>
  </div>
</aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
function escH(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// Group invoice_line_items rows (one per item) into one card per invoice —
// get_invoices_by_phone (migration 032) returns line-item granularity.
function groupByInvoice(rows) {
  const byInvoice = {};
  rows.forEach(r => {
    const key = r.invoice_number || r.zoho_invoice_id || r.sales_order_id;
    if (!byInvoice[key]) byInvoice[key] = { ...r, items: [] };
    byInvoice[key].items.push({ item_name: r.item_name, qty: r.final_quantity ?? r.requested_quantity, price: r.item_price });
  });
  return Object.values(byInvoice).sort((a, b) => (b.invoice_date || '').localeCompare(a.invoice_date || ''));
}

// Phone-based lookup (migration 127) can return invoices filed under
// several name spellings for the same person (e.g. "somya p" / "Somya
// Priyadarshini" / "SOMYA P") — picks whichever variant looks the most
// properly cased (each word capitalized, rest lowercase) to greet with,
// rather than whatever happened to be on the most recent invoice.
function pickBestCasedName(names) {
  const unique = [...new Set(names.filter(Boolean).map(n => n.trim()).filter(Boolean))];
  if (!unique.length) return '';
  function properCaseScore(name) {
    const words = name.split(/\s+/);
    const good = words.filter(w => /^[A-Z][a-z]*([-'][A-Z][a-z]*)*$/.test(w)).length;
    return good / words.length;
  }
  return unique.slice().sort((a, b) => {
    const diff = properCaseScore(b) - properCaseScore(a);
    if (diff) return diff;
    if (b.length !== a.length) return b.length - a.length; // prefer the fuller name on a tie
    return a.localeCompare(b);
  })[0];
}

// Whole calendar days between the invoice date and today, both taken as
// plain IST dates (not a raw ms difference, which time-of-day would throw
// off) — an invoice dated yesterday is 1 day overdue, dated today is 0.
function daysOverdue(invoiceDateStr) {
  if (!invoiceDateStr) return null;
  const todayIst = new Date(Date.now() + 330 * 60 * 1000).toISOString().slice(0, 10);
  const invMs = Date.parse(invoiceDateStr + 'T00:00:00Z');
  const todayMs = Date.parse(todayIst + 'T00:00:00Z');
  if (isNaN(invMs)) return null;
  return Math.round((todayMs - invMs) / 86400000);
}

function statusClass(inv) {
  if (inv.payment_status === 'paid') return 'paid';
  const days = daysOverdue(inv.invoice_date);
  return (days != null && days >= 1) ? 'overdue' : 'pending';
}

// Unpaid invoices show how overdue they are instead of a flat "pending" —
// more useful than a static label, and matches what balance due already
// implies. Paid invoices keep the plain "paid" badge (see formatPaidAt for
// the separate paid-on-date line under it).
function statusLabel(inv) {
  if (inv.payment_status === 'paid') return 'paid';
  const days = daysOverdue(inv.invoice_date);
  if (days == null) return inv.payment_status || 'pending';
  if (days <= 0) return 'Due today';
  return 'Overdue by ' + days + ' day' + (days === 1 ? '' : 's');
}

function formatPaidAt(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const datePart = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: 'Asia/Kolkata' });
  const timePart = d.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' });
  return datePart + ', ' + timePart;
}

let hasLookedUp = false; // guards the auto-refresh below — never fires before a real lookup has happened
let lastSearchedPhone = null; // the number that found these invoices — reused for pay-now-without-a-link, see payNowWithoutLink

// Two distinct screens, never both visible at once — "enter your phone
// number" and "here are your invoices" are never the same view, so there's
// no ambiguity about whether a number was actually submitted or just sitting
// in the box.
function showPhoneScreen() {
  document.getElementById('phone-screen').classList.remove('hidden');
  document.getElementById('results-screen').classList.add('hidden');
  document.getElementById('feedback-card').classList.add('hidden');
  document.getElementById('phone').value = '';
  document.getElementById('phone').focus();
}

// On a phone-width screen, the feedback card normally sits in the aside
// below every invoice card — on a customer with several invoices that's
// a long scroll before they ever see it. Moving the actual card node (not
// a copy — a copy would duplicate every id inside it, breaking the form)
// to right after the first invoice card puts it on screen without
// scrolling, matching what's already visible the moment results load.
// Desktop (>=860px, same breakpoint as the CSS) keeps it in the sidebar.
function placeFeedbackCard() {
  const card = document.getElementById('feedback-card');
  const aside = document.getElementById('feedback-aside');
  if (!card || !aside) return;
  const isDesktop = window.matchMedia('(min-width:860px)').matches;
  if (isDesktop) {
    if (card.parentElement !== aside) aside.appendChild(card);
    return;
  }
  const firstInvoice = document.querySelector('#results .invoice-card');
  if (firstInvoice) {
    if (firstInvoice.nextElementSibling !== card) firstInvoice.after(card);
  } else if (card.parentElement !== aside) {
    aside.appendChild(card);
  }
}
window.addEventListener('resize', () => { if (!document.getElementById('feedback-card').classList.contains('hidden')) placeFeedbackCard(); });

async function lookup() {
  const phoneInput = document.getElementById('phone').value.trim();
  lastSearchedPhone = phoneInput;
  if (!/^\d{10}$/.test(phoneInput)) {
    document.getElementById('results').innerHTML = '<div class="err-box show">Please enter a valid 10-digit phone number.</div>';
    document.getElementById('phone-screen').classList.add('hidden');
    document.getElementById('results-screen').classList.remove('hidden');
    return;
  }
  document.getElementById('phone-screen').classList.add('hidden');
  document.getElementById('results-screen').classList.remove('hidden');
  // Feedback card is only ever shown once a real, valid phone has been
  // looked up — so phone_number on every submission is reliably auto-
  // captured, never anonymous because someone never got past the entry
  // screen.
  document.getElementById('feedback-card').classList.remove('hidden');
  hasLookedUp = true;
  const btn = document.getElementById('lookup-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Looking up…';
  const results = document.getElementById('results');
  // A prior lookup on a phone-width screen may have physically moved the
  // feedback-card node into #results (placeFeedbackCard) — park it back in
  // the aside BEFORE wiping #results below, or clearing results.innerHTML
  // would destroy the card itself, not just hide it, leaving every lookup
  // after the first with no feedback card at all.
  document.getElementById('feedback-aside').appendChild(document.getElementById('feedback-card'));
  results.innerHTML = '';
  document.getElementById('welcome-heading').textContent = '';

  try {
    // get_invoices_by_phone matches phone_number exactly as stored — try
    // both the bare 10-digit form and the +91-prefixed form other parts of
    // the app sometimes store it as.
    let { data, error } = await sb.rpc('get_invoices_by_phone', { p_phone: phoneInput });
    if (!error && (!data || !data.length)) {
      ({ data, error } = await sb.rpc('get_invoices_by_phone', { p_phone: '+91' + phoneInput }));
    }
    if (error) throw new Error(error.message);

    // Daily visit log (migration 157) — every real phone lookup, regardless
    // of whether any invoices turned up, so a report can count distinct
    // numbers/houses that used this page on a given day. One row per
    // distinct house found, or a single null-house row when none did.
    // Fire-and-forget — never blocks rendering or surfaces to the customer.
    const visitNames = [...new Set((data || []).map(r => r.customer_name).filter(Boolean))];
    const visitRows = visitNames.length
      ? visitNames.map(name => ({ phone_number: phoneInput, customer_name: name }))
      : [{ phone_number: phoneInput, customer_name: null }];
    sb.from('invoice_page_visits').insert(visitRows).then(({ error: logErr }) => {
      if (logErr) console.error('visit log failed:', logErr.message);
    });

    if (!data || !data.length) {
      results.innerHTML = '<div class="empty-state">No invoices found for this number yet.</div>';
      return;
    }

    document.getElementById('welcome-heading').textContent = 'Welcome, ' + pickBestCasedName(data.map(r => r.customer_name)) + '!';

    const invoices = groupByInvoice(data);

    // "Pay All" — only worth showing once there's more than one pending
    // invoice to combine; a single pending invoice already has its own Pay
    // Now button right below. The amount shown is computed client-side from
    // the same balances already on screen — the actual link (and its
    // authoritative amount) is only created server-side when tapped, see
    // payAllPending.
    const pending = invoices.filter(inv => inv.payment_status !== 'paid');
    const pendingTotal = pending.reduce((sum, inv) => sum + (+inv.balance || 0), 0);
    const payAllHtml = pending.length >= 2
      ? '<div style="margin-bottom:16px">' +
          '<button class="btn-primary" id="pay-all-btn" onclick="payAllPending()">Pay All Pending — ₹'+pendingTotal.toFixed(2)+' ('+pending.length+' invoices)</button>' +
        '</div>'
      : '';

    results.innerHTML = payAllHtml + invoices.map(inv => {
      let itemsSubtotal = 0;
      const rows = inv.items.map(i => {
        const qty = +i.qty || 0, rate = +i.price || 0, value = qty * rate;
        itemsSubtotal += value;
        return '<tr><td>'+escH(i.item_name)+'</td><td>'+qty+'</td><td>₹'+rate.toFixed(2)+'</td><td>₹'+value.toFixed(2)+'</td></tr>';
      }).join('');
      const balance = +inv.balance || 0;
      const invoiceTotal = +inv.invoice_total || 0;
      // Computed from the real numbers (item rows vs. the post-discount
      // total Zoho actually billed) rather than re-deriving from
      // discount_type/discount_value — guarantees Subtotal - Discount =
      // Total reconciles exactly regardless of rounding, flat vs percent,
      // or a discount edited after these item rows were last written.
      // Only shown when a discount is actually on file AND it's enough to
      // show (a few paise of float noise shouldn't render a "Discount" row
      // on every invoice).
      const discountAmount = inv.discount_type ? (itemsSubtotal - invoiceTotal) : 0;
      const showDiscount = inv.discount_type && discountAmount > 0.01;
      const discountLabel = inv.discount_type === 'percent'
        ? 'Discount ('+(+inv.discount_value||0)+'% off)'
        : 'Discount';
      return '<div class="invoice-card">' +
        '<div class="row1">' +
          '<span class="inv-num">'+escH(inv.invoice_number || inv.sales_order_id || 'Invoice')+'</span>' +
          '<div class="status-col">' +
            '<span class="status '+statusClass(inv)+'">'+escH(statusLabel(inv))+'</span>' +
            (inv.payment_status === 'paid' && inv.payment_collected_at
              ? '<span class="paid-at">'+escH(formatPaidAt(inv.payment_collected_at))+'</span>'
              : '') +
          '</div>' +
        '</div>' +
        '<div class="meta">'+escH(inv.invoice_date || '')+'</div>' +
        '<table class="inv-items">' +
          '<thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Value</th></tr></thead>' +
          '<tbody>'+rows+'</tbody>' +
          '<tfoot>' +
            (showDiscount ? '<tr class="subtotal-row"><td colspan="3">Subtotal</td><td>₹'+itemsSubtotal.toFixed(2)+'</td></tr>' : '') +
            (showDiscount ? '<tr class="discount-row"><td colspan="3">'+escH(discountLabel)+'</td><td>−₹'+discountAmount.toFixed(2)+'</td></tr>' : '') +
            '<tr class="total-row"><td colspan="3">Total</td><td>₹'+invoiceTotal.toFixed(2)+'</td></tr>' +
            (balance > 0 ? '<tr class="balance-row"><td colspan="3">Balance due</td><td>₹'+balance.toFixed(2)+'</td></tr>' : '') +
          '</tfoot>' +
        '</table>' +
        (inv.payment_status !== 'paid'
          ? '<div class="actions">' + (
              inv.payment_link
                ? '<a class="pay" href="'+escH(inv.payment_link)+'" target="_blank" rel="noopener">Pay Now</a>'
                : '<button class="pay" onclick="payNowWithoutLink(this,'+escH(JSON.stringify(inv.sales_order_id))+')">Pay Now</button>'
            ) + '</div>'
          : '') +
      '</div>';
    }).join('');
  } catch (e) {
    results.innerHTML = '<div class="err-box show">Could not load invoices: '+escH(e.message)+'</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = 'View My Invoices';
    placeFeedbackCard();
  }
}

// "Pay All" — one Razorpay link for every pending invoice currently shown,
// created server-side only when tapped (create-storefront-bulk-payment-link
// does the actual work: reusing an existing unconsumed link if the pending
// set/amounts match, replacing it if not). No per-order ownership check
// needed client-side since the server derives the order list from the
// phone itself.
async function payAllPending() {
  const btn = document.getElementById('pay-all-btn');
  if (btn.disabled) return;
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Proceeding to pay…';
  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/create-storefront-bulk-payment-link', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON },
      body: JSON.stringify({ phone: lastSearchedPhone }),
    });
    const data = await res.json();
    if (!res.ok || !data.bulk) throw new Error(data.error || 'Could not create payment link');
    window.location.href = data.payment_url;
  } catch (e) {
    btn.disabled = false;
    btn.textContent = originalText;
    const err = document.createElement('div');
    err.className = 'err-box show';
    err.style.marginBottom = '10px';
    err.textContent = 'Could not start payment: ' + e.message;
    document.getElementById('results').prepend(err);
  }
}

// Pay Now for an invoice that has no Razorpay link yet (most commonly: the
// order never had a phone on orders, so generate-invoice's own best-effort
// link creation skipped it). Reuses the phone already searched with —
// that's the only phone create-storefront-payment-link will actually
// accept for this invoice anyway (it checks the number against
// invoice_line_items.phone_number), and reusing it means no second prompt,
// so this is one tap to a working payment link rather than two.
async function payNowWithoutLink(btnEl, salesOrderId) {
  if (btnEl.disabled) return;
  const originalText = btnEl.textContent;
  btnEl.disabled = true;
  btnEl.innerHTML = '<span class="spinner"></span>Proceeding to pay…';
  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/create-storefront-payment-link', {
      method: 'POST',
      // apikey/Authorization satisfy Supabase's gateway-level JWT check —
      // SUPABASE_ANON is the public anon key (config.js), safe to send from
      // the browser; it's not what actually gates this function (see
      // create-storefront-payment-link's own phone-ownership check).
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON },
      body: JSON.stringify({ sales_order_id: salesOrderId, phone: lastSearchedPhone }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not create payment link');
    window.location.href = data.payment_url;
  } catch (e) {
    btnEl.disabled = false;
    btnEl.textContent = originalText;
    const err = document.createElement('div');
    err.className = 'err-box show';
    err.style.marginBottom = '10px';
    err.textContent = 'Could not start payment: ' + e.message;
    document.getElementById('results').prepend(err);
  }
}

// Short "what can we improve / would you recommend us" survey, shown
// alongside invoices regardless of lookup state — phone_number is
// whatever's already been searched (lastSearchedPhone), left null if
// nothing has been looked up yet, since the survey isn't gated on that.
let fbScore = null;
function setFbScore(n) {
  fbScore = n;
  document.querySelectorAll('.fb-smiley').forEach(el => el.classList.toggle('active', +el.dataset.score === n));
}

async function submitFeedback() {
  const improve = (document.getElementById('fb-improve').value || '').trim();
  const resultEl = document.getElementById('fb-result');
  if (!improve && !fbScore) {
    resultEl.className = 'err';
    resultEl.textContent = 'Please answer at least one question.';
    return;
  }
  const btn = document.getElementById('fb-submit-btn');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Submitting…';
  resultEl.className = '';
  resultEl.textContent = '';
  try {
    const { error } = await sb.from('customer_feedback').insert({
      phone_number: lastSearchedPhone || null,
      improvement_text: improve || null,
      recommend_score: fbScore,
    });
    if (error) throw new Error(error.message);
    resultEl.className = 'ok';
    resultEl.textContent = 'Thank you! Your feedback helps us improve.';
    document.getElementById('fb-improve').value = '';
    document.getElementById('fb-improve').disabled = true;
    document.querySelectorAll('.fb-smiley').forEach(el => el.disabled = true);
    btn.remove();
  } catch (e) {
    resultEl.className = 'err';
    resultEl.textContent = 'Could not submit: ' + e.message;
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

document.getElementById('phone').addEventListener('keydown', e => { if (e.key === 'Enter') lookup(); });

// Pay Now opens Razorpay in a new tab — coming back here after paying
// shouldn't require manually clicking "View My Invoices" again to see the
// paid stamp. Re-runs the same lookup silently whenever this tab becomes
// visible again, as long as one has already succeeded once and nothing's
// already in flight.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!hasLookedUp) return;
  const btn = document.getElementById('lookup-btn');
  if (btn.disabled) return;
  lookup();
});
</script>
</body>
</html>
