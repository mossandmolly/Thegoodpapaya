<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The Good Papaya — Fresh Fruits & Vegetables</title>
<link rel="stylesheet" href="style.css">
<style>
/* Split layout: catalog left (~67%), specials + live cart right (~33%) —
   both panes visible together on one screen, no drawer to open. Ratio and
   density tuned from a round of mobile-width mockups. */
.shop-main{display:flex;height:calc(100vh - 53px);box-sizing:border-box}
.shop-left{width:67%;box-sizing:border-box;border-right:2px solid #eee0d0;display:flex;flex-direction:column;min-height:0}
.shop-left-head{padding:8px 8px 4px;flex-shrink:0}
.shop-left-head .search-bar{padding:7px 10px;font-size:12px;margin-bottom:6px}
.shop-left-head .cat-tabs{gap:5px;margin-bottom:0}
.shop-left-head .cat-tab{padding:4px 10px;font-size:11px}
.shop-grid-scroll{flex:1;overflow-y:auto;padding:4px 8px 8px}
.shop-grid-scroll .section-heading{font-size:10px;margin:8px 0 5px}
.shop-grid-scroll .item-grid{grid-template-columns:repeat(3,1fr);gap:4px}

.shop-right{width:33%;box-sizing:border-box;display:flex;flex-direction:column;min-height:0;background:#fff}
.specials-pane{flex:1;min-height:0;overflow-y:auto;background:#fff6ea;border-bottom:2px solid #eee0d0;padding:8px;box-sizing:border-box}
.specials-pane .label{font-size:10px;font-weight:800;color:#b5762a;text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px}
.specials-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.special-card{background:#fff;border:1.5px solid #e8720c;border-radius:6px;overflow:hidden}
.special-card .ph,.special-card img{width:100%;aspect-ratio:1/1;background:#f5efe4;font-size:20px;display:flex;align-items:center;justify-content:center;object-fit:cover}
.special-card .body{padding:3px 4px 4px}
.special-card .name{font-size:9px;font-weight:700;line-height:1.1}
.special-card .deal{font-size:7.5px;color:#e8720c;font-weight:700;margin-top:1px}
.specials-note{font-size:9px;color:#a89b8a;line-height:1.4;margin-top:8px}

.live-cart-pane{flex:1;min-height:0;display:flex;flex-direction:column}
.live-cart-head{font-size:10.5px;font-weight:700;color:#8a7a6a;text-transform:uppercase;letter-spacing:.3px;padding:8px 8px 6px;flex-shrink:0}
.live-cart-list{flex:1;min-height:0;overflow-y:auto;padding:0 8px 8px}
.live-cart-list .empty-state{font-size:11px;color:#a89b8a;padding:14px 4px;line-height:1.5;text-align:left}
.cart-live-row{padding:5px 0;border-bottom:1px solid #f5efe4}
.cart-live-row .row-top{display:flex;align-items:center;justify-content:space-between;gap:4px}
.cart-live-row .name{font-size:10.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cart-live-row .remove{font-size:9px;color:#b3261e;font-weight:700;cursor:pointer;flex-shrink:0}
.cart-live-row .row-controls{display:flex;align-items:center;gap:4px;margin-top:3px;flex-wrap:wrap}
.qty-stepper{display:flex;align-items:center;border:1px solid #eee0d0;border-radius:5px;overflow:hidden}
.qty-stepper span{cursor:pointer}
.qty-stepper span:first-child,.qty-stepper span:last-child{width:16px;height:16px;display:flex;align-items:center;justify-content:center;background:#f5efe4;font-size:10px}
.qty-stepper .val{width:17px;text-align:center;font-size:9.5px;font-weight:700}
.unit-toggle{display:flex;border:1px solid #eee0d0;border-radius:5px;overflow:hidden;font-size:7.5px;font-weight:600}
.unit-toggle span{padding:2px 5px;cursor:pointer;background:#f5efe4;color:#8a7a6a}
.unit-toggle span.active{background:#2d6b2d;color:#fff}
.note-input{width:100%;box-sizing:border-box;margin-top:3px;padding:3px 5px;border:1px solid #eee0d0;border-radius:4px;font-size:8.5px;color:#4a4237;font-family:inherit}
.live-cart-footer{padding:8px;border-top:1px solid #eee0d0;flex-shrink:0}
.live-cart-footer .checkout-cta{display:block;text-align:center;text-decoration:none;padding:9px;font-size:11.5px}

.item-card{position:relative;transition:transform .15s ease}
.item-card.pop{transform:scale(.92)}
.item-card .name{font-size:9px;font-weight:700;line-height:1.1;padding:3px 4px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-card .qty-badge{position:absolute;top:2px;right:2px;background:#2d6b2d;color:#fff;font-size:8px;font-weight:800;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center}

</style>
</head>
<body>

<header class="gp-header">
  <div class="brand">🥭 The Good Papaya<span>Fresh, delivered</span></div>
  <nav>
    <a href="invoices.html">My Invoices</a>
  </nav>
</header>

<div class="shop-main">
  <div class="shop-left">
    <div class="shop-left-head">
      <input type="text" class="search-bar" id="search" placeholder="🔍 Search fruits & vegetables…">
      <div class="cat-tabs">
        <div class="cat-tab active" data-cat="all" onclick="setCat('all')">All</div>
        <div class="cat-tab" data-cat="fruit" onclick="setCat('fruit')">🍎 Fruits</div>
        <div class="cat-tab" data-cat="vegetable" onclick="setCat('vegetable')">🥦 Vegetables</div>
      </div>
    </div>
    <div class="shop-grid-scroll" id="grid"><div class="empty-state">Loading…</div></div>
  </div>

  <div class="shop-right">
    <!-- Placeholder content until there's a real "specials" data source
         (e.g. a catalog.is_special flag) — flag to Somya before relying on
         this for anything beyond a design preview. -->
    <div class="specials-pane">
      <div class="label">🔥 Today's Specials</div>
      <div class="specials-grid">
        <div class="special-card">
          <div class="ph">🥭</div>
          <div class="body"><div class="name">Mango</div><div class="deal">10% off 2kg+</div></div>
        </div>
        <div class="special-card">
          <div class="ph">🍈</div>
          <div class="body"><div class="name">Guava</div><div class="deal">₹60/kg today</div></div>
        </div>
      </div>
      <div class="specials-note">New here? ₹50 off your first order — applies automatically.</div>
    </div>

    <div class="live-cart-pane">
      <div class="live-cart-head">Your cart (<span id="cart-count">0</span>)</div>
      <div class="live-cart-list" id="cart-list"></div>
      <div class="live-cart-footer" id="cart-footer"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
let catalog = [];
let cat = 'all';

const ICONS = [
  [/mango/i,'🥭'],[/apple/i,'🍎'],[/grape/i,'🍇'],[/banana/i,'🍌'],[/orange|mandarin|mosambi|kinnow/i,'🍊'],
  [/watermelon/i,'🍉'],[/muskmelon|melon/i,'🍈'],[/pineapple/i,'🍍'],[/peach/i,'🍑'],[/cherry/i,'🍒'],
  [/kiwi/i,'🥝'],[/coconut/i,'🥥'],[/lychee|longan|rambutan|mangosteen/i,'🫐'],[/pomegranate/i,'🔴'],
  [/strawberry/i,'🍓'],[/avocado/i,'🥑'],[/guava|sapota|jamun|custard apple|jackfruit|dragon|passion/i,'🍈'],
  [/tomato/i,'🍅'],[/carrot/i,'🥕'],[/potato/i,'🥔'],[/onion/i,'🧅'],[/capsicum|chilli/i,'🌶️'],
  [/corn/i,'🌽'],[/cucumber/i,'🥒'],[/broccoli|cabbage|cauliflower/i,'🥦'],[/eggplant|brinjal/i,'🍆'],
  [/leaf|leaves|spinach|amaranthus|methi|fenugreek|coriander/i,'🌿'],
];
function iconFor(name, category) {
  const hit = ICONS.find(([re]) => re.test(name));
  if (hit) return hit[1];
  return category === 'vegetable' ? '🥦' : '🍎';
}
function escH(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function setCat(c) {
  cat = c;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t.dataset.cat === c));
  render();
}

async function load() {
  const { data, error } = await sb.from('catalog')
    .select('item_name,unit_price,unit,category,image_url,sold_by_piece,piece_approx_kg,subsection')
    .eq('active', true)
    .order('item_name');
  if (error) {
    console.error('catalog load error:', error);
    document.getElementById('grid').innerHTML = '<div class="empty-state">Could not load the menu: '+escH(error.message)+'</div>';
    return;
  }
  catalog = data || [];
  render();
  renderLiveCart();
}

// Subsection display order — anything not listed here (a new/uncategorized
// subsection) just sorts alphabetically after these.
const SUBSECTION_ORDER = ['Daily Vegetables','Leafy Greens','Gourds & Other Vegetables','Seasonal Fruits','Everyday Fruits','Exotic & Berries'];

function render() {
  const search = document.getElementById('search').value.trim().toLowerCase();
  const rows = catalog.filter(c => {
    if (cat !== 'all' && c.category !== cat) return false;
    if (search && !c.item_name.toLowerCase().includes(search)) return false;
    return true;
  });
  const grid = document.getElementById('grid');
  if (!rows.length) { grid.innerHTML = '<div class="empty-state">No items found.</div>'; return; }

  const qtyMap = {};
  getCart().forEach(i => { qtyMap[i.item_name] = i.quantity; });

  const groups = {};
  rows.forEach(c => {
    const key = c.subsection || 'Other';
    (groups[key] = groups[key] || []).push(c);
  });
  const groupNames = Object.keys(groups).sort((a, b) => {
    const ia = SUBSECTION_ORDER.indexOf(a), ib = SUBSECTION_ORDER.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });

  grid.innerHTML = groupNames.map(name =>
    '<div class="section-heading">'+escH(name)+'</div>'+
    '<div class="item-grid">'+groups[name].map(c => cardHtml(c, qtyMap)).join('')+'</div>'
  ).join('');
}

// Dense, tap-only card — photo and name only (no price, no steppers on the
// card itself). Tapping bumps quantity by 1 each time, like counting out
// loud ("I want 3") — fine-tuning (exact amount, pc/kg, a note) happens in
// the live cart list on the right, not here.
function cardHtml(c, qtyMap) {
  const qty = qtyMap[c.item_name] || 0;
  const selected = qty > 0;
  return '<div class="item-card" data-item="'+escH(c.item_name)+'" onclick="bumpItem('+escH(JSON.stringify(c.item_name))+')">' +
    (c.image_url ? '<img src="'+escH(c.image_url)+'" loading="lazy">' : '<div class="ph">'+iconFor(c.item_name, c.category)+'</div>') +
    '<div class="name">'+escH(c.item_name)+'</div>' +
    (selected ? '<div class="qty-badge">'+qty+'</div>' : '') +
  '</div>';
}

function bumpItem(item_name) {
  const cart = getCart();
  const existing = cart.find(i => i.item_name === item_name);
  const current = existing ? existing.quantity : 0;
  setCartQty(item_name, +(current + 1).toFixed(2), existing ? existing.mode : 'kg');
  render();
  const el = document.querySelector('.item-card[data-item="'+CSS.escape(item_name)+'"]');
  if (el) {
    el.classList.add('pop');
    setTimeout(() => el.classList.remove('pop'), 180);
  }
}

// ── Live cart column (right pane) — qty stepper, pc/kg toggle (only for
// piece-eligible items), and a per-item notes field. Refreshed
// automatically by config.js's saveCart→updateCartBadge hook whenever the
// cart changes, so bumping a card on the left updates this without any
// extra wiring here.
function renderLiveCart() {
  const listEl = document.getElementById('cart-list');
  const footerEl = document.getElementById('cart-footer');
  const countEl = document.getElementById('cart-count');
  if (!listEl || !footerEl) return;
  const cart = getCart();
  if (countEl) countEl.textContent = cart.length;

  if (!cart.length) {
    listEl.innerHTML = '<div class="empty-state">Tap items on the left — they\'ll show up here.</div>';
    footerEl.innerHTML = '';
    return;
  }

  const catalogByName = {};
  catalog.forEach(c => catalogByName[c.item_name] = c);
  let subtotal = 0;
  let hasPieceItem = false;

  listEl.innerHTML = cart.map(i => {
    const c = catalogByName[i.item_name];
    const pieceEligible = !!(c && c.sold_by_piece);
    const mode = i.mode || 'kg';
    if (mode === 'piece') hasPieceItem = true;
    else if (c) subtotal += c.unit_price * i.quantity;

    const unitToggle = pieceEligible
      ? '<div class="unit-toggle">'+
          '<span class="'+(mode==='piece'?'active':'')+'" onclick="setItemMode('+escH(JSON.stringify(i.item_name))+',\'piece\')">pc</span>'+
          '<span class="'+(mode==='kg'?'active':'')+'" onclick="setItemMode('+escH(JSON.stringify(i.item_name))+',\'kg\')">kg</span>'+
        '</div>'
      : '';

    return '<div class="cart-live-row">' +
      '<div class="row-top">' +
        '<span class="name">'+escH(i.item_name)+'</span>' +
        '<span class="remove" onclick="removeLiveItem('+escH(JSON.stringify(i.item_name))+')">✕</span>' +
      '</div>' +
      '<div class="row-controls">' +
        '<div class="qty-stepper">' +
          '<span onclick="stepLiveQty('+escH(JSON.stringify(i.item_name))+',-1)">−</span>' +
          '<span class="val">'+i.quantity+'</span>' +
          '<span onclick="stepLiveQty('+escH(JSON.stringify(i.item_name))+',1)">+</span>' +
        '</div>' +
        unitToggle +
      '</div>' +
      '<input class="note-input" value="'+escH(i.note || '')+'" oninput="setCartNote('+escH(JSON.stringify(i.item_name))+',this.value)" placeholder="note e.g. papaya long, semi-ripe…">' +
    '</div>';
  }).join('');

  footerEl.innerHTML =
    '<a href="checkout.html" class="btn-primary checkout-cta">Checkout'+(subtotal>0?' — ₹'+subtotal.toFixed(0):'')+(hasPieceItem?' + packing items':'')+'</a>';
}

function stepLiveQty(item_name, delta) {
  const cart = getCart();
  const existing = cart.find(i => i.item_name === item_name);
  const current = existing ? existing.quantity : 0;
  setCartQty(item_name, +(current + delta).toFixed(2), existing ? existing.mode : undefined);
  render();
}

function removeLiveItem(item_name) {
  setCartQty(item_name, 0);
  render();
}

function setItemMode(item_name, mode) {
  const cart = getCart();
  const existing = cart.find(i => i.item_name === item_name);
  setCartQty(item_name, existing ? existing.quantity : 1, mode);
  render();
}

document.getElementById('search').addEventListener('input', render);
load();
</script>
</body>
</html>
