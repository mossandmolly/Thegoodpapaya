<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The Good Papaya — Fresh Fruits & Vegetables</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="gp-header">
  <div class="brand">🥭 The Good Papaya<span>Fresh, delivered</span></div>
  <nav>
    <a href="invoices.html">My Invoices</a>
    <a href="checkout.html" class="cart-link">🧺<span id="cart-badge" class="hidden">0</span></a>
  </nav>
</header>

<main>
  <input type="text" class="search-bar" id="search" placeholder="🔍 Search fruits & vegetables…">
  <div class="cat-tabs">
    <div class="cat-tab active" data-cat="all" onclick="setCat('all')">All</div>
    <div class="cat-tab" data-cat="fruit" onclick="setCat('fruit')">🍎 Fruits</div>
    <div class="cat-tab" data-cat="vegetable" onclick="setCat('vegetable')">🥦 Vegetables</div>
  </div>
  <div id="grid" class="item-grid"><div class="empty-state">Loading…</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
let catalog = [];
let cat = 'all';

const ICONS = [
  [/mango/i,'🥭'],[/apple/i,'🍎'],[/grape/i,'🍇'],[/banana/i,'🍌'],[/orange|mandarin|mosambi|kinnow/i,'🍊'],
  [/watermelon/i,'🍉'],[/muskmelon|melon/i,'🍈'],[/pineapple/i,'🍍'],[/peach/i,'🍑'],[/cherry/i,'🍒'],
  [/kiwi/i,'🥝'],[/coconut/i,'🥥'],[/lychee|longan|rambutan|mangosteen/i,'🫐'],[/pomegranate/i,'🔴'],
  [/strawberry/i,'🍓'],[/avocado/i,'🥑'],[/guava|sapota|jamun|custard apple|jackfruit|dragon|passion/i,'🍈'],
  [/tomato/i,'🍅'],[/carrot/i,'🥕'],[/potato/i,'🥔'],[/onion/i,'🧅'],[/capsicum|chilli/i,'🌶️'],
  [/corn/i,'🌽'],[/cucumber/i,'🥒'],[/broccoli|cabbage|cauliflower/i,'🥦'],[/eggplant|brinjal/i,'🍆'],
  [/leaf|leaves|spinach|amaranthus|methi|fenugreek|coriander/i,'🌿'],
];
function iconFor(name, category) {
  const hit = ICONS.find(([re]) => re.test(name));
  if (hit) return hit[1];
  return category === 'vegetable' ? '🥦' : '🍎';
}
function escH(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function setCat(c) {
  cat = c;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t.dataset.cat === c));
  render();
}

async function load() {
  const { data, error } = await sb.from('catalog')
    .select('item_name,unit_price,unit,category,image_url')
    .eq('active', true)
    .order('item_name');
  if (error) { document.getElementById('grid').innerHTML = '<div class="empty-state">Could not load the menu — please refresh.</div>'; return; }
  catalog = data || [];
  render();
}

function render() {
  const search = document.getElementById('search').value.trim().toLowerCase();
  const rows = catalog.filter(c => {
    if (cat !== 'all' && c.category !== cat) return false;
    if (search && !c.item_name.toLowerCase().includes(search)) return false;
    return true;
  });
  const grid = document.getElementById('grid');
  if (!rows.length) { grid.innerHTML = '<div class="empty-state">No items found.</div>'; return; }

  const cartMap = {};
  getCart().forEach(i => cartMap[i.item_name] = i.quantity);

  grid.innerHTML = rows.map(c => {
    const qty = cartMap[c.item_name] || 0;
    const step = c.unit === 'piece' || c.unit === 'pc' ? 1 : 0.5;
    return '<div class="item-card">' +
      (c.image_url ? '<img src="'+escH(c.image_url)+'" loading="lazy">' : '<div class="ph">'+iconFor(c.item_name, c.category)+'</div>') +
      '<div class="body">' +
        '<div class="name">'+escH(c.item_name)+'</div>' +
        '<div class="price">₹'+c.unit_price+' / '+escH(c.unit||'kg')+'</div>' +
        '<div class="add-row">' +
          (qty > 0
            ? '<button class="qty-btn" onclick="changeQty('+escH(JSON.stringify(c.item_name))+',-'+step+','+step+')">−</button>'+
              '<span class="qty-val">'+qty+'</span>'+
              '<button class="qty-btn" onclick="changeQty('+escH(JSON.stringify(c.item_name))+','+step+','+step+')">+</button>'
            : '<button class="add-btn" onclick="changeQty('+escH(JSON.stringify(c.item_name))+','+step+','+step+')">+ Add</button>') +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function changeQty(item_name, delta, step) {
  const cart = getCart();
  const existing = cart.find(i => i.item_name === item_name);
  const current = existing ? existing.quantity : 0;
  const next = Math.max(0, +(current + delta).toFixed(2));
  setCartQty(item_name, next);
  render();
}

document.getElementById('search').addEventListener('input', render);
load();
</script>
</body>
</html>
