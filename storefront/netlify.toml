# Standalone config for the storefront's own Netlify site (goodpapaya-shop)
# — separate from the root netlify.toml, which is ops-dashboard's. Talks
# straight to Supabase from the browser, so no Netlify Functions needed here.
[build]
  publish = "."

# Catalog temporarily hidden — storefront is invoices-only for now.
# Revert by deleting this block (index.html/checkout.html are untouched).
[[redirects]]
  from = "/"
  to = "/invoices.html"
  status = 200

[[redirects]]
  from = "/index.html"
  to = "/invoices.html"
  status = 200

[[redirects]]
  from = "/checkout.html"
  to = "/invoices.html"
  status = 200
