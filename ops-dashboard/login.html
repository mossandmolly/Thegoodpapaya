<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Good Papaya Ops — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 28px;
      width: 100%;
      max-width: 360px;
    }
    .login-logo { font-size: 2rem; text-align: center; margin-bottom: 4px; }
    .login-title { text-align: center; font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
    .login-sub { text-align: center; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 24px; }
    .login-field { margin-bottom: 14px; }
    .login-field label { display: block; font-size: 0.8rem; font-weight: 500; margin-bottom: 6px; color: var(--text-muted); }
    .login-field input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: 'DM Sans', sans-serif;
    }
    .login-field input:focus { outline: none; border-color: var(--brand); }
    .login-btn {
      width: 100%;
      padding: 13px;
      background: var(--brand);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .login-error { color: var(--red); font-size: 0.82rem; margin-top: 10px; text-align: center; display: none; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">🥭</div>
  <div class="login-title">Good Papaya Ops</div>
  <div class="login-sub">Sign in to continue</div>

  <div class="login-field">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email"
      onkeydown="if(event.key==='Enter') signIn()">
  </div>
  <div class="login-field">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
      onkeydown="if(event.key==='Enter') signIn()">
  </div>

  <button class="login-btn" id="login-btn" onclick="signIn()">Sign In</button>
  <p class="login-error" id="login-error"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script>
  // If already logged in, redirect to packer view
  sb.auth.getSession().then(({ data }) => {
    if (data.session) window.location.replace('index.html');
  });

  async function signIn() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('login-btn');
    const errEl    = document.getElementById('login-error');

    if (!email || !password) { showLoginError('Enter email and password'); return; }

    btn.disabled = true;
    btn.textContent = 'Signing in…';
    errEl.style.display = 'none';

    const { error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      showLoginError('Incorrect email or password');
      btn.disabled = false;
      btn.textContent = 'Sign In';
      return;
    }

    window.location.replace('index.html');
  }

  function showLoginError(msg) {
    const el = document.getElementById('login-error');
    el.textContent = msg;
    el.style.display = 'block';
  }
</script>
</body>
</html>
