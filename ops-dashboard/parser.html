<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Order Parser — Good Papaya Ops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .parser-wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
    .drop-zone {
      border: 2px dashed var(--border); border-radius: var(--radius);
      padding: 32px 20px; text-align: center; cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 12px; position: relative; background: var(--card-bg);
    }
    .drop-zone:hover, .drop-zone.drag { border-color: var(--brand); background: #fff5f0; }
    .drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .drop-icon { font-size: 2rem; margin-bottom: 8px; }
    .drop-label { font-size: 1rem; font-weight: 600; color: var(--text); display: block; margin-bottom: 4px; }
    .drop-sub { font-size: 0.8rem; color: var(--text-muted); }
    .previews { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .preview-thumb { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; border: 1.5px solid var(--border); }
    .status-bar { font-size: 0.85rem; color: var(--text-muted); text-align: center; min-height: 20px; margin-bottom: 12px; }
    .status-bar.loading { color: var(--brand); }
    .status-bar.error { color: var(--red); }
    .btn-parse {
      width: 100%; padding: 14px; border-radius: var(--radius);
      border: none; background: var(--brand); color: white;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      font-family: "DM Sans", sans-serif; margin-bottom: 10px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-parse:hover { background: var(--brand-dark); }
    .btn-parse:active { transform: scale(0.98); }
    .btn-parse:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-sec {
      width: 100%; padding: 11px; border-radius: var(--radius);
      border: 1.5px solid var(--border); background: white;
      color: var(--text); font-size: 0.9rem; cursor: pointer;
      font-family: "DM Sans", sans-serif; margin-bottom: 8px;
    }
    .btn-sec:hover { background: var(--bg); }
    .section-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin: 16px 0 6px; }
    .flags-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 10px 14px; font-size: 0.82rem; color: #92400e; line-height: 1.8; white-space: pre-wrap; }
    .flags-ok { background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 8px; padding: 10px 14px; font-size: 0.82rem; color: var(--green); }
    .tsv-box { background: #f9f9f9; border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: monospace; font-size: 11px; color: var(--text); overflow-x: auto; white-space: pre; line-height: 1.6; max-height: 300px; overflow-y: auto; margin-bottom: 10px; }
    .row-count { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
    .hidden { display: none; }
    .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--border); border-top-color: var(--brand); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div class="header-content">
    <h1>Good Papaya Ops</h1>
    <nav>
      <a href="index.html">Packer</a>
      <a href="checker.html">Checker</a>
      <a href="order-entry.html">Order Entry</a>
      <a href="parser.html" class="active">Parser</a>
      <a href="admin.html">Admin</a>
      <a href="somya.html">Somya AI</a>
      <a href="#" onclick="signOut()" style="color:rgba(255,255,255,0.7);font-size:0.8rem">Sign out</a>
    </nav>
  </div>
</header>

<div class="parser-wrap">
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept="image/*" multiple>
    <div class="drop-icon">📸</div>
    <span class="drop-label">Upload WhatsApp screenshots</span>
    <div class="drop-sub">Tap to select · Multiple images OK</div>
  </div>

  <div class="previews" id="previews"></div>
  <div class="status-bar" id="statusBar">Upload screenshots to begin</div>
  <button class="btn-parse" id="parseBtn" disabled>Parse orders</button>

  <div id="resultsWrap" class="hidden">
    <div class="section-label">Flags</div>
    <div id="flagsBox"></div>
    <div class="section-label">Parsed rows <span id="rowCount" style="font-weight:600;color:var(--text)"></span></div>
    <div class="tsv-box" id="tsvBox"></div>
    <button class="btn-sec" id="copyBtn">📋 Copy TSV</button>
    <button class="btn-sec" id="clearBtn">🔄 Clear & start over</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script>
const TODAY = new Date(Date.now() + 330*60*1000).toISOString().split('T')[0];
const EDGE_URL = 'https://fykqprogzqcfzrgwlrem.supabase.co/functions/v1/parse-orders';

let imageFiles = [];
const fileInput  = document.getElementById('fileInput');
const dropZone   = document.getElementById('dropZone');
const previews   = document.getElementById('previews');
const parseBtn   = document.getElementById('parseBtn');
const statusBar  = document.getElementById('statusBar');
const resultsWrap= document.getElementById('resultsWrap');
const flagsBox   = document.getElementById('flagsBox');
const tsvBox     = document.getElementById('tsvBox');
const rowCount   = document.getElementById('rowCount');
const copyBtn    = document.getElementById('copyBtn');
const clearBtn   = document.getElementById('clearBtn');

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag'); addFiles([...e.dataTransfer.files]); });
fileInput.addEventListener('change', () => addFiles([...fileInput.files]));

function addFiles(files) {
  files.filter(f => f.type.startsWith('image/')).forEach(f => {
    imageFiles.push(f);
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    img.className = 'preview-thumb';
    previews.appendChild(img);
  });
  if (imageFiles.length) {
    parseBtn.disabled = false;
    statusBar.textContent = imageFiles.length + ' image(s) ready';
    statusBar.className = 'status-bar';
  }
}

function toB64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

parseBtn.addEventListener('click', async () => {
  if (!imageFiles.length) return;
  parseBtn.disabled = true;
  resultsWrap.classList.add('hidden');
  statusBar.innerHTML = '<span class="spinner"></span>Uploading images…';
  statusBar.className = 'status-bar loading';

  try {
    const b64s = await Promise.all(imageFiles.map(toB64));
    const images = b64s.map((data, i) => ({ data, media_type: imageFiles[i].type }));
    statusBar.innerHTML = '<span class="spinner"></span>Parsing with AI…';
    const session = await sb.auth.getSession();
    const token = session.data.session?.access_token;
    const resp = await fetch(EDGE_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`,
        'apikey': SUPABASE_ANON
      },
      body: JSON.stringify({ images, date: TODAY })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Edge function error ' + resp.status);
    render(data);
  } catch(e) {
    statusBar.textContent = '❌ ' + e.message;
    statusBar.className = 'status-bar error';
    parseBtn.disabled = false;
  }
});

function render(parsed) {
  const { rows = [], flags = [] } = parsed;
  if (flags.length) {
    flagsBox.className = 'flags-box';
    flagsBox.textContent = flags.join('\n');
  } else {
    flagsBox.className = 'flags-ok';
    flagsBox.textContent = 'All rows parsed cleanly ✓';
  }
  const header = 'order_date\tcustomer_name\titem_name\tdescription\tquantity\tfinal_quantity\tstatus\tsales_order';
  const lines = rows.map(r =>
    [r.order_date, r.customer_name, r.item_name, r.description||'', r.quantity, '', '', r.sales_order].join('\t')
  );
  tsvBox.textContent = [header, ...lines].join('\n');
  rowCount.textContent = '— ' + rows.length + ' row' + (rows.length !== 1 ? 's' : '');
  resultsWrap.classList.remove('hidden');
  statusBar.textContent = 'Done — ' + rows.length + ' rows parsed';
  statusBar.className = 'status-bar';
  parseBtn.disabled = false;
}

copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(tsvBox.textContent).then(() => {
    copyBtn.textContent = '✅ Copied!';
    setTimeout(() => { copyBtn.textContent = '📋 Copy TSV'; }, 2000);
  });
});

clearBtn.addEventListener('click', () => {
  imageFiles = [];
  previews.innerHTML = '';
  fileInput.value = '';
  parseBtn.disabled = true;
  statusBar.textContent = 'Upload screenshots to begin';
  statusBar.className = 'status-bar';
  resultsWrap.classList.add('hidden');
  tsvBox.textContent = '';
});

// ── Push to Operations ──────────────────────────────────────────────────────
const pushb=document.getElementById('pushb'),ps=document.getElementById('ps'),pp=document.getElementById('pp'),ppRows=document.getElementById('pp-rows');
let pendingPush=null;

function setPush(msg,cls){ps.textContent=msg;ps.className='push-status'+(cls?' '+cls:'');}

function normPhone(raw){
  const d=(raw||'').replace(/\D/g,'');
  if(d.length===10&&/^[6-9]/.test(d))return '+91'+d;
  if(d.length===12&&d.startsWith('91'))return '+'+d;
  if(d.length===11&&d.startsWith('0'))return '+91'+d.slice(1);
  return null;
}

pushb.addEventListener('click',async()=>{
  const records=lastRows.filter(r=>r.customer_name&&r.item_name).map(r=>({
    customer_name: r.customer_name,
    invoice_date: r.order_date,
    item_name: r.item_name,
    description: r.description||null,
    requested_quantity: parseFloat(r.quantity)||0,
  }));
  if(!records.length){setPush('Nothing to push — parse some orders first','err');return;}
  pushb.disabled=true;pushb.textContent='Checking…';setPush('');
  try{
    const uniqueCustomers=[...new Set(records.map(r=>r.customer_name))];
    const{data:phoneData}=await sb.from('customer_phones').select('customer_name').in('customer_name',uniqueCustomers);
    const hasPhone=new Set((phoneData||[]).map(r=>r.customer_name.toLowerCase()));
    const needPhone=uniqueCustomers.filter(c=>!hasPhone.has(c.toLowerCase()));
    if(needPhone.length){
      pendingPush=records;
      ppRows.innerHTML=needPhone.map(name=>{
        const slug=name.toLowerCase().replace(/[^a-z0-9]/g,'-');
        return '<div class="phone-row"><span>'+name.replace(/</g,'&lt;')+'</span><input type="tel" id="pph-'+slug+'" data-customer="'+name.replace(/"/g,'&quot;')+'" placeholder="+91 XXXXX XXXXX"></div>';
      }).join('');
      pp.classList.remove('hidden');
      pushb.disabled=false;pushb.textContent='📤 Push to Operations';
      return;
    }
    await doPush(records);
  }catch(e){
    setPush('❌ '+e.message,'err');pushb.disabled=false;pushb.textContent='📤 Push to Operations';
  }
});

document.getElementById('pp-skip').addEventListener('click',async()=>{
  pp.classList.add('hidden');
  if(pendingPush)await doPush(pendingPush,true);
  pendingPush=null;
});

document.getElementById('pp-save').addEventListener('click',async()=>{
  const inputs=ppRows.querySelectorAll('input');
  const phoneRows=[];
  inputs.forEach(input=>{
    const phone=normPhone(input.value.trim());
    if(phone)phoneRows.push({customer_name:input.dataset.customer,phone_number:phone,label:'primary'});
  });
  if(phoneRows.length){
    const{error}=await sb.from('customer_phones').upsert(phoneRows,{onConflict:'customer_name,phone_number'});
    if(error){setPush('Could not save phones: '+error.message,'err');return;}
  }
  pp.classList.add('hidden');
  if(pendingPush)await doPush(pendingPush,true);
  pendingPush=null;
});

async function doPush(records,allowMissingPhones){
  pushb.disabled=true;pushb.textContent='Pushing…';setPush('');
  try{
    const res=await fetch(SUPABASE_URL+'/functions/v1/add-orders',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_ANON},
      body:JSON.stringify({records,allowMissingPhones:!!allowMissingPhones}),
    });
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||'Push failed');
    if(data.missingPhones?.length){
      pendingPush=records;
      ppRows.innerHTML=data.missingPhones.map(name=>{
        const slug=name.toLowerCase().replace(/[^a-z0-9]/g,'-');
        return '<div class="phone-row"><span>'+name.replace(/</g,'&lt;')+'</span><input type="tel" id="pph-'+slug+'" data-customer="'+name.replace(/"/g,'&quot;')+'" placeholder="+91 XXXXX XXXXX"></div>';
      }).join('');
      pp.classList.remove('hidden');
      pushb.disabled=false;pushb.textContent='📤 Push to Operations';
      return;
    }
    const n=data.inserted||0,heldMsg=data.held>0?' ('+data.held+' held as duplicate)':'';
    setPush('✅ '+n+' item'+(n!==1?'s':'')+' pushed to Operations'+heldMsg,'ok');
    pushb.textContent='✅ Pushed';
  }catch(e){
    setPush('❌ '+e.message,'err');
    pushb.disabled=false;pushb.textContent='📤 Push to Operations';
  }
}

// ── Held items approval ──────────────────────────────────────────────────────
function escH2(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function loadHeldItems(){
  const list=document.getElementById('hi-list');
  list.innerHTML='<div class="held-empty">Loading…</div>';
  const{data,error}=await sb.from('operations')
    .select('id, sales_order_id, invoice_date, customer_name, item_name, requested_quantity, description')
    .eq('status','held')
    .order('invoice_date',{ascending:false})
    .order('customer_name');
  if(error){list.innerHTML='<div class="held-empty">'+escH2(error.message)+'</div>';return;}
  document.getElementById('hi-rc').textContent=data&&data.length?'— '+data.length:'';
  updateHeldBadge(data?data.length:0);
  if(!data||!data.length){list.innerHTML='<div class="held-empty">No held items ✓</div>';return;}
  list.innerHTML=data.map(item=>
    '<div class="held-item" data-id="'+item.id+'">'+
      '<div class="hi-top"><span class="hi-cust">'+escH2(item.customer_name)+'</span><span class="hi-date">'+item.invoice_date+'</span></div>'+
      '<div class="hi-item">'+escH2(item.item_name)+' · '+item.requested_quantity+(item.description?' · '+escH2(item.description):'')+'</div>'+
      '<div class="hi-actions">'+
        '<button class="hi-approve" onclick="approveHeld(\''+item.id+'\')">Approve</button>'+
        '<button class="hi-dismiss" onclick="dismissHeld(\''+item.id+'\')">Dismiss</button>'+
      '</div>'+
    '</div>'
  ).join('');
}

function updateHeldBadge(n){
  const el=document.getElementById('held-count');
  el.textContent=n>0?'('+n+')':'';
}

async function approveHeld(id){
  const{error}=await sb.from('operations').update({status:'draft'}).eq('id',id);
  if(error){alert('Failed to approve: '+error.message);return;}
  await loadHeldItems();
}

async function dismissHeld(id){
  const{error}=await sb.from('operations').delete().eq('id',id);
  if(error){alert('Failed to dismiss: '+error.message);return;}
  await loadHeldItems();
}

document.getElementById('hi-refresh').addEventListener('click',loadHeldItems);

// Populate the held-count badge on load, without switching tabs
sb.from('operations').select('id',{count:'exact',head:true}).eq('status','held')
  .then(({count})=>updateHeldBadge(count||0));
</script>
</body>
</html>
