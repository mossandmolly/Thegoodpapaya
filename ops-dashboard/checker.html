<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Checker View — Good Papaya Ops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .invoice-bar{
      position:fixed;bottom:0;left:0;right:0;z-index:100;
      background:white;border-top:2px solid var(--brand);
      padding:10px 16px;display:flex;align-items:center;gap:12px;
      box-shadow:0 -2px 12px rgba(0,0,0,.08);
    }
    .invoice-bar.hidden{display:none}
    .inv-ready-label{font-size:.875rem;color:var(--text);flex:1}
    .inv-ready-label strong{color:var(--brand)}
    .invoice-status-wrap{
      background:white;border-top:1px solid var(--border);
      padding:14px 16px 80px;display:none;
    }
    .invoice-status-wrap.visible{display:block}
    .inv-status-heading{font-weight:600;font-size:.9rem;margin-bottom:10px;display:flex;align-items:center;gap:10px}
    .inv-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f0f0f0;font-size:.85rem}
    .inv-row:last-child{border-bottom:none}
    .inv-cust{flex:1;font-weight:500}
    .inv-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600}
    .inv-pending  {background:#f1f5f9;color:#64748b}
    .inv-queued   {background:#dbeafe;color:#1d4ed8}
    .inv-processing{background:#fef3c7;color:#d97706}
    .inv-done     {background:#dcfce7;color:#15803d}
    .inv-failed   {background:#fee2e2;color:#dc2626}
    .inv-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
    .inv-processing .inv-dot{animation:invpulse .8s ease-in-out infinite alternate}
    @keyframes invpulse{to{opacity:.25}}
    .inv-err{font-size:.72rem;color:var(--red);margin-left:auto;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .inv-link{font-size:.78rem;color:var(--brand);text-decoration:none;margin-left:auto}
    .inv-link:hover{text-decoration:underline}
  </style>
</head>
<body>

<header>
  <div class="header-content">
    <h1>Good Papaya Ops</h1>
    <nav>
      <a href="index.html">Packer</a>
      <a href="checker.html" class="active">Checker</a>
      <a href="order-entry.html">Order Entry</a>
      <a href="admin.html">Admin</a>
      <a href="somya.html">Somya AI</a>
    <a href="#" onclick="signOut()" style="color:rgba(255,255,255,0.7);font-size:0.8rem">Sign out</a>
    </nav>
  </div>
</header>

<!-- Filter bar -->
<div class="filter-bar" id="filter-bar">
  <select id="filter-community">
    <option value="">All Communities</option>
  </select>
  <select id="filter-status">
    <option value="">All Status</option>
    <option value="draft">Draft</option>
    <option value="packed">Packed</option>
    <option value="final">Final</option>
  </select>
  <input type="text" id="filter-search" placeholder="Search customer…" style="flex:1;min-width:120px">
</div>

<!-- Summary bar -->
<div class="summary-bar hidden" id="summary-bar">
  <span>Total: <strong id="sum-total">0</strong></span>
  <span>Done: <strong id="sum-done">0</strong></span>
  <span>Pending: <strong id="sum-pending">0</strong></span>
  <span style="margin-left:auto">
    <button class="btn btn-sm btn-secondary" id="btn-select-all" onclick="toggleSelectAll()">Select All</button>
  </span>
</div>

<!-- Bulk action bar -->
<div class="bulk-bar hidden" id="bulk-bar">
  <span id="bulk-count">0 selected</span>
  <div style="display:flex;gap:8px;margin-left:auto">
    <button class="btn btn-sm btn-success" onclick="bulkFinalize()">Mark Final</button>
    <button class="btn btn-sm btn-secondary" onclick="clearSelection()">Clear</button>
  </div>
</div>

<!-- Section header -->
<div class="section-header hidden" id="section-header">
  <h2 id="section-date"></h2>
  <p class="count" id="section-count"></p>
</div>

<main>
  <div class="empty-state" id="empty-state">
    <div style="font-size:2.5rem">📋</div>
    <p>Loading today's items…</p>
  </div>

  <!-- Orders accordion -->
  <div id="orders-container"></div>
</main>

<!-- Invoice status section (appears after Generate Invoices is clicked) -->
<div class="invoice-status-wrap" id="invoice-status-wrap">
  <div class="inv-status-heading">
    Invoice Generation
    <span id="inv-status-summary" style="font-size:.78rem;font-weight:400;color:var(--text-muted)"></span>
  </div>
  <div id="invoice-status-list"></div>
</div>

<!-- Invoice bar (sticky bottom) -->
<div class="invoice-bar hidden" id="invoice-bar">
  <span class="inv-ready-label" id="inv-ready-label">—</span>
  <button class="btn btn-primary" id="btn-generate" onclick="generateInvoices()">Generate Invoices</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/checker.js"></script>
</body>
</html>
