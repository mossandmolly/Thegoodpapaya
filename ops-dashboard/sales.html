<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales — Good Papaya Ops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root{
      --veg:      #1baf7a;
      --veg-dark: #128a5f;
      --fruit:      #e34948;
      --fruit-dark: #b93534;
    }
    .sales-main{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
    .controls-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
    .controls-row label{font-size:.78rem;color:var(--text-muted);display:flex;align-items:center;gap:6px}
    .controls-row input,.controls-row select{padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem;font-family:'DM Sans',sans-serif}

    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:22px}
    .kpi-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
    .kpi-card h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:10px;font-weight:600}
    .kpi-compare{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
    .kpi-val{font-size:1.5rem;font-weight:600}
    .kpi-arrow{font-size:.9rem;font-weight:700;padding:2px 7px;border-radius:8px;white-space:nowrap}
    .kpi-arrow.up{color:#0ca30c;background:#e6f7e6}
    .kpi-arrow.down{color:#d03b3b;background:#fdecec}
    .kpi-arrow.flat{color:var(--text-muted);background:var(--bg)}
    .kpi-sub{font-size:.75rem;color:var(--text-muted);margin-top:6px}
    .kpi-prepost{display:flex;gap:14px;font-size:.78rem;color:var(--text-muted);margin-top:8px}
    .kpi-prepost b{color:var(--text);font-weight:600}

    .section{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 18px 8px;margin-bottom:20px}
    .section h2{font-size:1rem;font-weight:600;margin-bottom:4px}
    .section .hint{font-size:.78rem;color:var(--text-muted);margin-bottom:14px}

    .legend{display:flex;gap:16px;font-size:.78rem;color:var(--text-muted);margin-bottom:10px;flex-wrap:wrap}
    .legend span{display:inline-flex;align-items:center;gap:6px}
    .swatch{width:11px;height:11px;border-radius:3px;display:inline-block}
    .swatch.veg{background:var(--veg)}
    .swatch.fruit{background:var(--fruit)}

    .chart-wrap{overflow-x:auto}
    svg text{font-family:'DM Sans',sans-serif}
    .bar-label{font-size:10px;fill:#52514e}
    .axis-label{font-size:10.5px;fill:#898781}
    .grid-line{stroke:#e1e0d9;stroke-width:1}

    .data-table-wrap{margin-top:10px;overflow-x:auto}
    table.sales-table{width:100%;border-collapse:collapse;font-size:.82rem}
    table.sales-table th{background:var(--bg);padding:8px 10px;text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);white-space:nowrap;border-bottom:1px solid var(--border)}
    table.sales-table td{padding:8px 10px;border-top:1px solid #f0f0f0;white-space:nowrap}
    table.sales-table tr.period-pre td{background:#fafafa}
    table.sales-table tr.period-post td{background:#f2fbf6}
    .period-tag{font-size:.68rem;font-weight:600;padding:1px 7px;border-radius:8px;text-transform:uppercase;letter-spacing:.03em}
    .tag-pre{background:#f1f5f9;color:#64748b}
    .tag-post{background:#dcfce7;color:#15803d}
    .tag-transition{background:#fef3c7;color:#92400e}

    .veg-pct-bar{display:inline-flex;align-items:center;gap:6px;width:100%}
    .veg-pct-track{flex:1;min-width:60px;height:7px;border-radius:4px;background:var(--bg);overflow:hidden}
    .veg-pct-fill{height:100%;background:var(--veg)}

    .unmatched-note{font-size:.78rem;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 12px;margin:0 0 16px}

    .state-msg{padding:40px 20px;text-align:center;color:var(--text-muted)}
  </style>
</head>
<body>

<header>
  <div class="header-content">
    <h1>Good Papaya Ops</h1>
    <nav>
      <a href="index.html">Packer</a>
      <a href="checker.html">Checker</a>
      <a href="order-entry.html">Order Entry</a>
      <a href="parser.html">Parser</a>
      <a href="sales.html" class="active">Sales</a>
      <a href="admin.html">Admin</a>
      <a href="somya.html">Somya AI</a>
      <a href="#" onclick="signOut()" style="color:rgba(255,255,255,0.7);font-size:0.8rem">Sign out</a>
    </nav>
  </div>
</header>

<main class="sales-main">

  <div class="controls-row">
    <label>Month <input type="month" id="ctl-month"></label>
    <label>Vegetable launch date <input type="date" id="ctl-launch"></label>
    <button class="btn btn-secondary btn-sm" onclick="loadDashboard()">↻ Refresh</button>
    <span id="ctl-status" style="font-size:.78rem;color:var(--text-muted)"></span>
  </div>

  <div id="dashboard-body">
    <div class="state-msg">Loading…</div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/sales.js"></script>
</body>
</html>
