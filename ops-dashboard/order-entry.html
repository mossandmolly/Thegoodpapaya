<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Order Entry — Good Papaya Ops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="header-content">
    <h1>Good Papaya Ops</h1>
    <nav>
      <a href="index.html">Packer</a>
      <a href="checker.html">Checker</a>
      <a href="order-entry.html" class="active">Order Entry</a>
      <a href="admin.html">Admin</a>
      <a href="somya.html">Somya AI</a>
      <a href="#" onclick="signOut()" style="color:rgba(255,255,255,0.7);font-size:0.8rem">Sign out</a>
    </nav>
  </div>
</header>

<div class="section-header" style="display:block;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px">
  <div>
    <h2>Order Entry</h2>
    <p class="count" id="section-count">Loading…</p>
  </div>
  <button class="btn btn-secondary btn-sm" id="sync-btn" onclick="syncFromZoho()" style="font-size:0.78rem;white-space:nowrap">↻ Sync from Zoho</button>
</div>

<main style="padding:12px 16px">

  <div style="overflow-x:auto">
    <table class="oe-table" id="oe-table">
      <thead>
        <tr>
          <th style="width:108px">Date</th>
          <th style="width:120px">Customer</th>
          <th style="min-width:150px">Item</th>
          <th style="width:64px">Qty</th>
          <th style="min-width:110px">Notes</th>
          <th style="width:32px"></th>
          <th style="width:32px"></th>
        </tr>
      </thead>
      <tbody id="oe-tbody"></tbody>
    </table>
  </div>

  <div style="margin-top:10px;display:flex;align-items:center;justify-content:space-between">
    <button class="btn btn-secondary btn-sm" onclick="addRow('')">+ New customer</button>
    <button class="btn btn-primary btn-sm" id="oe-submit-btn" onclick="submitOrders()">Submit orders →</button>
  </div>
  <div id="oe-status" style="font-size:0.85rem;margin-top:6px"></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/order-entry.js"></script>
</body>
</html>
