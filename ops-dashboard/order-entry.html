<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Order Entry — Good Papaya Ops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    main{padding:12px 16px 72px}

    /* ── Capture card ───────────────────────────── */
    .oe-card{
      background:#fff;border:1px solid var(--border);
      border-radius:10px;padding:10px 12px;margin-bottom:10px;
    }
    .oe-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
    .oe-date-pick{
      border:1px solid var(--border);border-radius:6px;
      padding:5px 8px;font-family:inherit;font-size:.83rem;
      background:var(--bg);color:var(--text);
    }
    .oe-mic{
      width:30px;height:30px;border-radius:50%;
      border:1.5px solid var(--border);background:#fff;
      cursor:pointer;font-size:.65rem;color:var(--text-muted);
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;transition:background .1s,border-color .1s;
    }
    .oe-mic.recording{background:#fee2e2;border-color:#fca5a5;color:#dc2626}
    .oe-mic-hint{font-size:.72rem;color:#9ca3af;flex:1;line-height:1.2}
    .oe-textarea{
      width:100%;height:54px;border:1px solid var(--border);
      border-radius:7px;padding:8px 10px;font-size:.88rem;
      font-family:inherit;resize:none;background:var(--bg);
      color:var(--text);box-sizing:border-box;
    }
    .oe-textarea:focus{outline:none;border-color:#9ca3af;background:#fff}
    .oe-textarea::placeholder{color:#c8cfd8}
    .oe-card-actions{
      display:flex;justify-content:space-between;
      align-items:center;margin-top:7px;
    }
    .oe-ghost{
      border:none;background:none;font-family:inherit;
      font-size:.78rem;color:#9ca3af;cursor:pointer;padding:2px 0;
    }
    .oe-ghost:hover{color:var(--text-muted)}
    .oe-parse{
      border:1.5px solid var(--border);background:#fff;
      font-family:inherit;font-size:.82rem;font-weight:500;
      color:var(--text);cursor:pointer;padding:5px 13px;
      border-radius:6px;transition:border-color .1s,background .1s;
    }
    .oe-parse:hover{border-color:#9ca3af;background:var(--bg)}

    /* ── Order table ────────────────────────────── */
    .oe-table-wrap{
      background:#fff;border:1px solid var(--border);
      border-radius:10px;overflow:hidden;overflow-x:auto;
    }
    .oe-grid{
      width:100%;border-collapse:collapse;
      table-layout:fixed;min-width:540px;
    }
    .col-date{width:108px}
    .col-cust{width:22%}
    .col-item{width:22%}
    .col-qty {width:62px}
    /* col-desc: auto */
    .col-del {width:28px}

    .oe-grid thead th{
      font-size:.62rem;font-weight:600;text-transform:uppercase;
      letter-spacing:.07em;color:#b0b8c4;
      padding:9px 7px 7px;text-align:left;
      border-bottom:1.5px solid #f0f0f0;
    }
    .oe-grid thead th:first-child{padding-left:12px}

    .oe-tr{border-bottom:1px solid #f5f5f5;transition:background .07s}
    .oe-tr:last-child{border-bottom:none}
    .oe-tr:hover{background:#fafafa}
    .oe-tr:hover .oe-del{opacity:1}

    /* left accent: new customer = green, unknown item = amber */
    .oe-tr.is-new  > td:first-child{box-shadow:inset 3px 0 0 #16a34a}
    .oe-tr.is-warn > td:first-child{box-shadow:inset 3px 0 0 #f59e0b}

    .oe-tr td{padding:2px 3px;vertical-align:middle}
    .oe-tr td:first-child{padding-left:8px}
    .oe-tr td:last-child {padding-right:4px}

    .oe-in{
      width:100%;border:none;background:transparent;
      padding:7px 5px;font-size:.875rem;font-family:inherit;
      color:var(--text);border-radius:5px;
    }
    .oe-in:focus{outline:none;background:#f0f6ff}
    .oe-in::placeholder{color:#d1d5db}
    .oe-in-qty{text-align:right}
    .oe-in-date{font-size:.8rem;color:var(--text-muted)}

    .oe-del{
      border:none;background:none;color:#d1d5db;cursor:pointer;
      padding:3px 5px;font-size:.72rem;opacity:0;
      transition:color .1s,opacity .1s;line-height:1;
    }
    .oe-del:hover{color:#ef4444}

    /* ── Table footer ───────────────────────────── */
    .oe-footer{
      display:flex;align-items:center;justify-content:space-between;
      padding:8px 12px 9px;border-top:1px solid #f0f0f0;gap:8px;
    }
    .oe-add-btns{display:flex;gap:14px;flex-wrap:wrap}
    .oe-add{
      border:none;background:none;font-family:inherit;
      font-size:.82rem;color:var(--brand);cursor:pointer;padding:0;
    }
    .oe-add:hover{text-decoration:underline}

    /* ── Phone prompt ───────────────────────────── */
    .oe-phone-prompt{
      background:#fffbeb;border:1.5px solid #fcd34d;
      border-radius:10px;padding:14px;margin-top:10px;
    }
    .oe-phone-prompt h3{
      font-size:.72rem;font-weight:600;text-transform:uppercase;
      letter-spacing:.05em;color:#92400e;margin:0 0 5px;
    }
    .oe-phone-prompt p{font-size:.82rem;color:#92400e;margin:0 0 10px;line-height:1.5}
    .oe-phone-table{width:100%;border-collapse:collapse}
    .oe-phone-table th{
      font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;
      color:#9ca3af;padding:3px 6px;text-align:left;font-weight:600;
    }
    .oe-phone-table td{padding:4px 6px;vertical-align:middle}
    .oe-phone-name{font-weight:500;font-size:.875rem;white-space:nowrap}
    .oe-phone-input{
      width:100%;border:1px solid var(--border);border-radius:6px;
      padding:6px 8px;font-size:.875rem;font-family:inherit;
      background:var(--bg);color:var(--text);letter-spacing:.04em;
    }
    .oe-phone-input:focus{outline:none;border-color:#9ca3af;background:#fff}
    .btn-sm-mic{
      font-size:.75rem;padding:5px 9px;background:#eaf3de;color:#3b6d11;
      border:1px solid #c7e3a8;border-radius:6px;cursor:pointer;white-space:nowrap;
    }
    .btn-sm-mic.recording{background:#faece7;color:#993c1d;border-color:#f3bba8}
    .oe-phone-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

    /* ── Combobox ───────────────────────────────── */
    .oe-cb-dropdown{
      position:fixed;background:#fff;border:1px solid #d1d5db;
      border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);
      z-index:9999;max-height:220px;overflow-y:auto;display:none;
    }
    .oe-cb-item{padding:8px 12px;cursor:pointer;font-size:.86rem}
    .oe-cb-item:hover{background:#f3f4f6}
    .oe-cb-item strong{color:#059669}

    /* hidden status anchor for JS */
    #status-line{display:none}
  </style>
</head>
<body>
<header>
  <div class="header-content">
    <h1>Good Papaya Ops</h1>
    <nav>
      <a href="index.html">Packer</a>
      <a href="checker.html">Checker</a>
      <a href="order-entry.html" class="active">Order Entry</a>
      <a href="admin.html">Admin</a>
      <a href="somya.html">Somya AI</a>
      <a href="#" onclick="signOut()" style="color:rgba(255,255,255,0.7);font-size:0.8rem">Sign out</a>
    </nav>
  </div>
</header>

<span id="status-line"></span>

<main>
  <!-- ── Voice / text capture ── -->
  <div class="oe-card">
    <div class="oe-top">
      <input type="date" id="order-date" class="oe-date-pick">
      <button id="mic-btn" class="oe-mic" type="button" title="Speak">●</button>
      <span id="mic-status" class="oe-mic-hint"></span>
    </div>
    <textarea id="raw-input" class="oe-textarea"
      placeholder="Speak, type, or paste a table copied from Excel / Sheets…"></textarea>
    <div class="oe-card-actions">
      <button id="clear-input-btn" class="oe-ghost" type="button">✕ clear</button>
      <button id="parse-btn" class="oe-parse" type="button">Parse →</button>
    </div>
  </div>

  <!-- ── Order table ── -->
  <div class="oe-table-wrap">
    <table class="oe-grid">
      <colgroup>
        <col class="col-date">
        <col class="col-cust">
        <col class="col-item">
        <col class="col-qty">
        <col><!-- desc auto -->
        <col class="col-del">
      </colgroup>
      <thead>
        <tr>
          <th style="padding-left:14px">Date</th>
          <th>Customer</th>
          <th>Item</th>
          <th style="text-align:right">Qty</th>
          <th>Description</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows-container"></tbody>
    </table>

    <div class="oe-footer">
      <div class="oe-add-btns">
        <button class="oe-add" type="button" onclick="addSameCustomerRow()">+ same customer</button>
        <button class="oe-add" type="button" onclick="addBlankRow()" style="color:var(--text-muted)">+ new customer</button>
      </div>
      <button id="submit-btn" class="btn btn-primary btn-sm" type="button">Submit →</button>
    </div>
  </div>

  <!-- ── Phone prompt ── -->
  <div id="phone-prompt" class="oe-phone-prompt" style="display:none">
    <h3>Phone numbers needed</h3>
    <p>These customers don't have a mobile number on file. Add one below, or skip to submit without.</p>
    <table class="oe-phone-table">
      <thead><tr><th style="width:38%">Customer</th><th>Mobile</th><th style="width:76px"></th></tr></thead>
      <tbody id="phone-table-body"></tbody>
    </table>
    <div class="oe-phone-actions">
      <button class="btn btn-primary btn-sm" onclick="submitWithPhones()">Save &amp; submit →</button>
      <button class="btn btn-secondary btn-sm" onclick="skipPhones()">Skip</button>
    </div>
  </div>
</main>

<div id="oe-cb-dropdown" class="oe-cb-dropdown"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/order-parser.js"></script>
<script src="js/order-entry.js"></script>
</body>
</html>
