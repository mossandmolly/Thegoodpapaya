<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Order Entry — Good Papaya Ops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="header-content">
    <h1>Good Papaya Ops</h1>
    <nav>
      <a href="index.html">Packer</a>
      <a href="checker.html">Checker</a>
      <a href="order-entry.html" class="active">Order Entry</a>
      <a href="admin.html">Admin</a>
      <a href="somya.html">Somya AI</a>
      <a href="#" onclick="signOut()" style="color:rgba(255,255,255,0.7);font-size:0.8rem">Sign out</a>
    </nav>
  </div>
</header>

<div class="section-header" style="display:block">
  <h2>Order Entry</h2>
  <p class="count" id="section-count">Add items below, then submit</p>
</div>

<main style="max-width:680px;margin:0 auto;padding:16px">

  <!-- Entry form -->
  <div class="admin-section" style="margin-bottom:16px">
    <div style="display:flex;flex-direction:column;gap:10px">

      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <div style="flex:1;min-width:140px">
          <label class="field-label">Date</label>
          <input type="date" id="oe-date" style="width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:0.9rem;font-family:'DM Sans',sans-serif;box-sizing:border-box">
        </div>
        <div style="flex:2;min-width:180px">
          <label class="field-label">Customer / Door number</label>
          <input type="text" id="oe-customer" placeholder="e.g. Villa 83, B-12" style="width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:0.9rem;font-family:'DM Sans',sans-serif;box-sizing:border-box">
        </div>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <div style="flex:2;min-width:160px">
          <label class="field-label">Fruit / Item</label>
          <input type="text" id="oe-item" placeholder="e.g. Alphonso Mango" style="width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:0.9rem;font-family:'DM Sans',sans-serif;box-sizing:border-box">
        </div>
        <div style="flex:1;min-width:80px">
          <label class="field-label">Qty</label>
          <input type="number" id="oe-qty" placeholder="1" min="0" step="0.01" style="width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:0.9rem;font-family:'DM Sans',sans-serif;box-sizing:border-box">
        </div>
      </div>

      <div>
        <label class="field-label">Description <span style="color:var(--text-muted);font-weight:400">(optional)</span></label>
        <input type="text" id="oe-desc" placeholder="Any notes for the packer" style="width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:0.9rem;font-family:'DM Sans',sans-serif;box-sizing:border-box">
      </div>

      <button class="btn btn-primary" onclick="addItem()" style="align-self:flex-start;padding:10px 28px">+ Add to list</button>
    </div>
  </div>

  <!-- Pending items list -->
  <div id="oe-list-wrap" class="hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <h3 style="font-size:0.95rem;margin:0">Items to submit <span id="oe-count" style="color:var(--text-muted);font-weight:400"></span></h3>
      <button class="btn btn-sm btn-secondary" onclick="clearAll()">Clear all</button>
    </div>
    <div id="oe-list"></div>
    <div style="margin-top:14px;display:flex;align-items:center;gap:12px">
      <button class="btn btn-success" id="oe-submit-btn" onclick="submitOrders()">Submit Orders</button>
      <span id="oe-status" style="font-size:0.85rem"></span>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/order-entry.js"></script>
</body>
</html>
