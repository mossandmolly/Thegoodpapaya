<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Order Entry — Good Papaya Ops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .oe-input-card {
      background: var(--surface, #fff);
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .oe-input-card h3 {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted, #6b7280);
      margin: 0 0 10px;
    }
    .oe-top-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .oe-top-bar input[type="date"] {
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 6px;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 0.88rem;
      background: var(--bg, #f9fafb);
      color: var(--text, #111);
    }
    .oe-textarea {
      width: 100%;
      min-height: 100px;
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.92rem;
      font-family: inherit;
      resize: vertical;
      background: var(--bg, #f9fafb);
      color: var(--text, #111);
    }
    .oe-textarea:focus { outline: none; border-color: #9ca3af; }
    .oe-btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .mic-status { font-size: 0.76rem; color: var(--text-muted, #6b7280); margin-top: 5px; min-height: 16px; }
    .btn-mic { background: #eaf3de; color: #3b6d11; border-color: #c7e3a8; }
    .btn-mic.recording { background: #faece7; color: #993c1d; border-color: #f3bba8; }
    .oe-summary-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px 10px;
      font-size: 0.84rem;
      color: var(--text-muted, #6b7280);
      flex-wrap: wrap;
      gap: 6px;
    }
    .oe-row-card {
      background: #fff;
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .oe-row-card.is-warn { background: #fffbeb; border-color: #fcd34d; }
    .oe-row-card.is-new-customer { border-left: 3px solid #16a34a; }
    .oe-row-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .oe-row-tags { display: flex; gap: 5px; flex-wrap: wrap; min-height: 20px; }
    .oe-tag { font-size: 0.68rem; font-weight: 600; padding: 2px 7px; border-radius: 5px; display: inline-block; }
    .oe-tag-new { background: #dcfce7; color: #15803d; }
    .oe-tag-warn { background: #fef3c7; color: #92400e; }
    .oe-field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .oe-field-grid.full { grid-template-columns: 1fr; }
    .oe-field-label { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.05em; color: #9ca3af; display: block; margin-bottom: 3px; }
    .oe-field-input {
      width: 100%;
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.88rem;
      font-family: inherit;
      background: var(--bg, #f9fafb);
      color: var(--text, #111);
    }
    .oe-field-input:focus { outline: none; border-color: #9ca3af; background: #fff; }
    .oe-price-hint { font-size: 0.7rem; color: #9ca3af; margin-top: 3px; }
    .oe-warn-reason { font-size: 0.76rem; color: #92400e; margin-top: 5px; line-height: 1.4; }
    .oe-row-delete { background: none; border: none; color: #d1d5db; font-size: 0.9rem; padding: 0 4px; cursor: pointer; line-height: 1; }
    .oe-row-delete:hover { color: #ef4444; }
    .oe-empty-state { text-align: center; padding: 32px 16px; color: #9ca3af; font-size: 0.88rem; line-height: 1.8; }
    .oe-submit-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .oe-cb-dropdown {
      position: absolute;
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      z-index: 9999;
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }
    .oe-cb-item { padding: 8px 12px; cursor: pointer; font-size: 0.86rem; }
    .oe-cb-item:hover { background: #f3f4f6; }
    .oe-cb-item strong { color: #059669; }
  </style>
</head>
<body>

<header>
  <div class="header-content">
    <h1>Good Papaya Ops</h1>
    <nav>
      <a href="index.html">Packer</a>
      <a href="checker.html">Checker</a>
      <a href="order-entry.html" class="active">Order Entry</a>
      <a href="admin.html">Admin</a>
      <a href="somya.html">Somya AI</a>
      <a href="#" onclick="signOut()" style="color:rgba(255,255,255,0.7);font-size:0.8rem">Sign out</a>
    </nav>
  </div>
</header>

<div class="section-header" style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px">
  <div>
    <h2>Order Entry</h2>
    <p class="count" id="status-line">Loading catalog and customers…</p>
  </div>
</div>

<main style="padding:12px 16px">

  <div class="oe-input-card">
    <h3>Speak or type orders</h3>
    <div class="oe-top-bar">
      <input type="date" id="order-date">
      <button id="mic-btn" class="btn btn-mic" type="button">● Speak</button>
    </div>
    <textarea id="raw-input" class="oe-textarea"
      placeholder="Tap the mic and speak, or paste transcribed text here.
example: Villa 23 guava 1 kg
Ahad 12601 mango half kg strawberry 2 boxes"></textarea>
    <div class="mic-status" id="mic-status"></div>
    <div class="oe-btn-row">
      <button id="parse-btn" class="btn btn-primary" type="button">Parse orders</button>
      <button id="clear-input-btn" class="btn btn-secondary" type="button">Clear text</button>
    </div>
  </div>

  <div id="results-section" style="display:none">
    <div class="oe-summary-bar">
      <span id="summary-text"></span>
      <div style="display:flex;gap:6px">
        <button id="add-row-btn" class="btn btn-secondary btn-sm" type="button">+ Add row</button>
        <button id="clear-all-btn" class="btn btn-secondary btn-sm" style="color:var(--red,#dc2626)" type="button">Clear all</button>
      </div>
    </div>
    <div id="rows-container"></div>
    <div class="oe-submit-row">
      <button id="submit-btn" class="btn btn-primary" type="button">Submit to ops →</button>
    </div>
  </div>

  <div id="empty-state" class="oe-empty-state">
    No orders yet — speak or paste text above, then tap "Parse orders".<br>
    Or <button class="btn btn-secondary btn-sm" onclick="addBlankRow()" style="margin-left:4px">add a row manually</button>.
  </div>

</main>

<div id="oe-cb-dropdown" class="oe-cb-dropdown"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/order-parser.js"></script>
<script src="js/order-entry.js"></script>
</body>
</html>
